<script>

  (() => {

        metadata: {

            'Monte Mor',
            'Nova Odessa',
            'Paulínia',
            'Sumaré',
            'Valinhos',
            'Vinhedo',

          ],
          funcoes: [
            'Negociador de Suprimentos (CNS)',

    /* ========================================================================
     * ARMAZENAMENTO SEGURO DE CREDENCIAL NO DISPOSITIVO (LOCALSTORAGE)
     * ======================================================================== */
    function saveDeviceCredential(idEvento, idInscricao) {
      try {
        if (!idEvento || !idInscricao || !window.localStorage) return;
        localStorage.setItem(
          `cns_cred_${String(idEvento).toLowerCase()}`,
          String(idInscricao).toLowerCase()
        );
      } catch (_) {
        // Ignora caso localStorage esteja bloqueado no navegador
      }
    }

    function getDeviceCredential(idEvento) {
      try {
        if (!idEvento || !window.localStorage) return '';
        return localStorage.getItem(`cns_cred_${String(idEvento).toLowerCase()}`) || '';
      } catch (_) {
        return '';
      }
    }

    /* ========================================================================
     * CONFIGURAÇÃO DO TOASTR E UTILITÁRIOS DE UI / ÁUDIO
     * ======================================================================== */
    if (window.toastr) {
      toastr.options = {
        closeButton: true,
        progressBar: true,
        positionClass: 'toast-top-right',
        timeOut: '4000',
        extendedTimeOut: '1500',
        preventDuplicates: true
      };
    }

    /**
     * Exibe ou oculta o overlay global de carregamento.
     * @param {boolean} show Se verdadeiro, exibe o spinner.
     * @param {string} [message] Texto descritivo.
     */
    function setLoading(show, message = 'Processando solicitação...') {
      const overlay = document.getElementById('global-loading');
      const textEl = document.getElementById('global-loading-text');
      if (!overlay) return;
      if (textEl) textEl.textContent = message;
      overlay.classList.toggle('d-none', !show);
    }

    /**
     * Escapa caracteres HTML especiais para prevenir XSS ao montar tabelas dinâmicas.
     * @param {*} str Valor a ser escapado.
     * @returns {string}
     */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * Formata uma data ISO (YYYY-MM-DD) para o padrão brasileiro (DD/MM/AAAA).
     * @param {string} isoDate Data YYYY-MM-DD.
     * @returns {string}
     */
    function formatDateBr(isoDate) {
      if (!isoDate) return '—';
      const parts = String(isoDate).trim().split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return String(isoDate);
    }

    /**
     * Formata um timestamp ISO 8601 para exibição amigável em pt-BR.
     * @param {string} isoTimestamp Timestamp ISO.
     * @returns {string}
     */
    function formatTimestampBr(isoTimestamp) {
      if (!isoTimestamp) return '—';
      const parsed = new Date(isoTimestamp);
      if (isNaN(parsed.getTime())) return String(isoTimestamp);
      return parsed.toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    /**
     * Emite sinal sonoro sintetizado via Web Audio API para confirmações de Check-in.
     * @param {'success'|'warning'|'error'} type Tipo de alerta sonoro.
     */
    function playBeepSound(type = 'success') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
          osc.start();
          osc.stop(ctx.currentTime + 0.28);
        } else if (type === 'warning') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch (_) {
        // Ignora caso o navegador bloqueie áudio automático
      }
    }

    /**
     * Wrapper Promise para chamadas assíncronas ao Google Apps Script (`google.script.run`).
     * @param {string} methodName Nome da função exposta em Code.js.
     * @param {...*} args Argumentos da função.
     * @returns {Promise<*>}
     */
    function callServerRpc(methodName, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(
            new Error(
              'Ambiente google.script.run não detectado. Execute a aplicação a partir do Web App do Google Apps Script.'
            )
          );
          return;
        }

        google.script.run
          .withSuccessHandler((response) => resolve(response))
          .withFailureHandler((err) => {
            const msg = err && err.message ? err.message : String(err || 'Erro desconhecido no servidor.');
            reject(new Error(msg));
          })[methodName](...args);
      });
    }

    /* ========================================================================
     * ACESSIBILIDADE DE FORMULÁRIOS (Sem erros prematuros antes de interação)
     * ======================================================================== */
    const FormAccessibilityBridge = (() => {
      const dirtyState = new WeakMap();

      const applyValidationVisuals = (input, forceShowError = false) => {
        if (!input || typeof input.checkValidity !== 'function') return;
        const state = dirtyState.get(input) || { hasInteracted: false, hasBlurred: false };
        const shouldEvaluate = forceShowError || (state.hasInteracted && state.hasBlurred);

        if (!shouldEvaluate) {
          return;
        }

        const isValid = input.checkValidity();
        if (!isValid) {
          input.setAttribute('aria-invalid', 'true');
          input.classList.add('user-invalid-fallback');
          input.classList.remove('user-valid-fallback');
        } else {
          input.removeAttribute('aria-invalid');
          input.classList.remove('user-invalid-fallback');
          input.classList.add('user-valid-fallback');
        }

        const fieldWrapper = input.closest('.col-md-5, .col-md-6, .col-md-7, .col-md-8, .col-md-4, .col-12, .lgpd-consent-box, .mb-3');
        if (fieldWrapper) {
          fieldWrapper.classList.toggle('field-invalid', !isValid);
        }
      };

      const bindForm = (formEl) => {
        if (!formEl) return;

        formEl.addEventListener(
          'blur',
          (e) => {
            if (e.target && e.target.matches('input, select, textarea')) {
              const state = dirtyState.get(e.target) || { hasInteracted: false, hasBlurred: false };
              state.hasBlurred = true;
              dirtyState.set(e.target, state);
              if (state.hasInteracted) {
                applyValidationVisuals(e.target, false);
              }
            }
          },
          true
        );

        formEl.addEventListener('input', (e) => {
          if (e.target && e.target.matches('input, select, textarea')) {
            const state = dirtyState.get(e.target) || { hasInteracted: false, hasBlurred: false };
            state.hasInteracted = true;
            dirtyState.set(e.target, state);
            if (e.target.checkValidity()) {
              e.target.removeAttribute('aria-invalid');
              e.target.classList.remove('user-invalid-fallback');
              const wrap = e.target.closest('.col-md-5, .col-md-6, .col-md-7, .col-md-8, .col-md-4, .col-12, .lgpd-consent-box, .mb-3');
              if (wrap) wrap.classList.remove('field-invalid');
            }
          }
        });

        formEl.addEventListener('change', (e) => {
          if (e.target && e.target.matches('input, select, textarea')) {
            const state = dirtyState.get(e.target) || { hasInteracted: false, hasBlurred: false };
            if (e.target.value !== '' || e.target.type === 'checkbox') {
              state.hasInteracted = true;
              state.hasBlurred = true;
              dirtyState.set(e.target, state);
              applyValidationVisuals(e.target, false);
            }
          }
        });
      };

      const validateFormAll = (formEl) => {
        if (!formEl) return false;
        const controls = formEl.querySelectorAll('input[required], select[required], textarea[required], input[type="email"]');
        controls.forEach((ctrl) => {
          dirtyState.set(ctrl, { hasInteracted: true, hasBlurred: true });
          applyValidationVisuals(ctrl, true);
        });
        return formEl.checkValidity();
      };

      const resetFormValidation = (formEl) => {
        if (!formEl) return;
        formEl.querySelectorAll('input, select, textarea').forEach((ctrl) => {
          dirtyState.delete(ctrl);
          ctrl.removeAttribute('aria-invalid');
          ctrl.classList.remove('user-invalid-fallback', 'user-valid-fallback');
        });
        formEl.querySelectorAll('.field-invalid').forEach((w) => w.classList.remove('field-invalid'));
      };

      return { bindForm, validateFormAll, resetFormValidation, applyValidationVisuals };
    })();

    /**
     * Valida pares de campos onde pelo menos um (E-mail OU Telefone) deve ser preenchido.
     * Se um deles estiver preenchido corretamente, o outro torna-se opcional.
     *
     * @param {string} emailInputId ID do input de e-mail.
     * @param {string} phoneInputId ID do input de telefone.
     * @param {number} [minPhoneDigits=10] Mínimo de dígitos exigidos caso o telefone seja preenchido.
     * @returns {boolean} True se pelo menos um for válido e nenhum preenchido estiver inválido.
     */
    function validateEitherEmailOrPhone(emailInputId, phoneInputId, minPhoneDigits = 10) {
      const emailEl = document.getElementById(emailInputId);
      const phoneEl = document.getElementById(phoneInputId);
      if (!emailEl || !phoneEl) return true;

      const emailVal = emailEl.value.trim();
      const phoneVal = phoneEl.value.trim();
      const phoneDigits = phoneVal.replace(/\D/g, '');

      const emailWrap = emailEl.closest('.col-md-5, .col-md-6, .col-md-7, .col-12');
      const phoneWrap = phoneEl.closest('.col-md-5, .col-md-6, .col-md-7, .col-12');

      const setFieldInvalid = (el, wrap, invalid) => {
        if (invalid) {
          el.setAttribute('aria-invalid', 'true');
          el.classList.add('user-invalid-fallback');
          if (wrap) wrap.classList.add('field-invalid');
        } else {
          el.removeAttribute('aria-invalid');
          el.classList.remove('user-invalid-fallback');
          if (wrap) wrap.classList.remove('field-invalid');
        }
      };

      // Nenhum dos dois foi preenchido
      if (!emailVal && !phoneDigits) {
        setFieldInvalid(emailEl, emailWrap, true);
        setFieldInvalid(phoneEl, phoneWrap, true);
        return false;
      }

      let emailOk = true;
      if (emailVal) {
        emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(emailVal);
      }

      let phoneOk = true;
      if (phoneVal) {
        phoneOk = phoneDigits.length >= minPhoneDigits;
      }

      setFieldInvalid(emailEl, emailWrap, !emailOk);
      setFieldInvalid(phoneEl, phoneWrap, !phoneOk);

      return emailOk && phoneOk;
    }

    /**
     * Vincula limpeza mútua de estado de erro entre os pares E-mail / Telefone.
     */
    function bindEitherEmailOrPhonePair(emailInputId, phoneInputId) {
      const emailEl = document.getElementById(emailInputId);
      const phoneEl = document.getElementById(phoneInputId);
      if (!emailEl || !phoneEl) return;

      const clearPairErrorsIfAnyFilled = () => {
        if (emailEl.value.trim() || phoneEl.value.replace(/\D/g, '')) {
          [emailEl, phoneEl].forEach((el) => {
            el.removeAttribute('aria-invalid');
            el.classList.remove('user-invalid-fallback');
            const wrap = el.closest('.col-md-5, .col-md-6, .col-md-7, .col-12');
            if (wrap) wrap.classList.remove('field-invalid');
          });
        }
      };

      emailEl.addEventListener('input', clearPairErrorsIfAnyFilled);
      phoneEl.addEventListener('input', clearPairErrorsIfAnyFilled);
    }

    /* ========================================================================
     * INICIALIZAÇÃO DO SELECT2 EM TODOS OS ELEMENTOS <select>
     * ======================================================================== */
    function initAllSelect2() {
      if (!window.jQuery || !jQuery.fn.select2) return;

      jQuery('select.js-select2').each(function () {
        const $select = jQuery(this);
        const modalParent = $select.closest('.modal');
        const placeholderText = $select.attr('data-placeholder') || '';

        const config = {
          width: '100%',
          language: {
            noResults: () => 'Nenhum resultado encontrado',
            searching: () => 'Buscando...'
          }
        };

        if (placeholderText) {
          config.placeholder = placeholderText;
          config.allowClear = false;
        }

        if (modalParent.length > 0) {
          config.dropdownParent = modalParent;
        }

        if ($select.hasClass('select2-hidden-accessible')) {
          $select.select2('destroy');
        }

        $select.select2(config).on('select2:select', function () {
          const wrap = this.closest('.col-md-6, .col-12');
          if (wrap && this.value) {
            wrap.classList.remove('field-invalid');
            this.removeAttribute('aria-invalid');
          }
        });
      });
    }

    /**
     * Popula as opções de Cidade e Função nos selects públicos e administrativos.
     */
    function populateStaticSelectOptions() {
      const cidades = (AppState.portal.metadata && AppState.portal.metadata.cidades) || [];
      const funcoes = (AppState.portal.metadata && AppState.portal.metadata.funcoes) || [];

      const pubCidade = document.getElementById('pub-cidade');
      if (pubCidade) {
        pubCidade.innerHTML =
          '<option value="">Selecione a cidade...</option>' +
          cidades.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      }

      const pubFuncao = document.getElementById('pub-funcao');
      if (pubFuncao) {
        pubFuncao.innerHTML =
          '<option value="">Selecione sua função...</option>' +
          funcoes.map((f) => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('');
      }

      const manCidade = document.getElementById('man-cidade');
      if (manCidade) {
        manCidade.innerHTML = cidades
          .map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      }

      const manFuncao = document.getElementById('man-funcao');
      if (manFuncao) {
        manFuncao.innerHTML = funcoes
          .map((f) => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('');
      }

      const insFilterCidade = document.getElementById('ins-filter-cidade');
      if (insFilterCidade) {
        insFilterCidade.innerHTML =
          '<option value="ALL">Todas as Cidades</option>' +
          cidades.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      }

      // Se houver e-mail de Conta Google detectado na sessão, pré-preenche nos campos de e-mail
      const detectedEmail = AppState.portal.metadata && AppState.portal.metadata.detectedGoogleEmail;
      if (detectedEmail) {
        const pubEmail = document.getElementById('pub-email');
        if (pubEmail && !pubEmail.value) pubEmail.value = detectedEmail;
        const scEmail = document.getElementById('sc-email');
        if (scEmail && !scEmail.value) scEmail.value = detectedEmail;
      }

      initAllSelect2();
    }

    /* ========================================================================
     * ROTEAMENTO DE VIEWS (PORTAL vs. CHECKIN ONLINE vs. ADMIN)
     * ======================================================================== */
    function switchView(targetView, options = {}) {
      let normalized = 'portal';
      if (targetView === 'admin') normalized = 'admin';
      else if (targetView === 'checkin') normalized = 'checkin';

      AppState.currentView = normalized;

      const viewPortal = document.getElementById('view-portal');
      const viewCheckin = document.getElementById('view-checkin');
      const viewAdmin = document.getElementById('view-admin');

      const btnPortal = document.getElementById('btn-nav-portal');
      const btnCheckin = document.getElementById('btn-nav-checkin');
      const btnAdmin = document.getElementById('btn-nav-admin');

      viewPortal.classList.add('d-none');
      viewCheckin.classList.add('d-none');
      viewAdmin.classList.add('d-none');

      btnPortal.className = 'btn btn-sm btn-outline-light fw-bold';
      btnCheckin.className = 'btn btn-sm btn-outline-light fw-bold';
      btnAdmin.className = 'btn btn-sm btn-outline-light fw-bold';

      if (normalized === 'admin') {
        viewAdmin.classList.remove('d-none');
        btnAdmin.className = 'btn btn-sm btn-light fw-bold';
      } else if (normalized === 'checkin') {
        stopQrScanner();
        viewCheckin.classList.remove('d-none');
        btnCheckin.className = 'btn btn-sm btn-light fw-bold';
        renderSelfCheckinView();
      } else {
        stopQrScanner();
        viewPortal.classList.remove('d-none');
        btnPortal.className = 'btn btn-sm btn-light fw-bold';

        const autoCheckinInput = document.getElementById('pub-auto-checkin-now');
        const instantAlert = document.getElementById('portal-instant-checkin-alert');
        const submitBtn = document.getElementById('btn-submit-inscricao');

        if (options.instantCheckInMode) {
          autoCheckinInput.value = 'true';
          instantAlert.classList.remove('d-none');
          submitBtn.innerHTML =
            '<i class="bi bi-check2-all me-2"></i>Concluir Inscrição e Confirmar Minha Presença Agora';
        } else {
          autoCheckinInput.value = 'false';
          instantAlert.classList.add('d-none');
          submitBtn.innerHTML =
            '<i class="bi bi-check2-circle me-2"></i>Confirmar Inscrição e Gerar Credencial QR Code';
        }

        renderPortalView();
      }
    }

    /* ========================================================================
     * ROTA 1: PORTAL PÚBLICO DE CONVOCAÇÃO E INSCRIÇÃO
     * ======================================================================== */
    function renderPortalView() {
      const emptyContainer = document.getElementById('portal-empty-container');
      const activeContainer = document.getElementById('portal-active-container');
      const voucherContainer = document.getElementById('portal-voucher-container');

      if (AppState.portal.lastVoucher) {
        emptyContainer.classList.add('d-none');
        activeContainer.classList.add('d-none');
        voucherContainer.classList.remove('d-none');
        return;
      }

      voucherContainer.classList.add('d-none');

      if (!AppState.portal.hasActiveEvent || !AppState.portal.activeEvent) {
        activeContainer.classList.add('d-none');
        emptyContainer.classList.remove('d-none');
        return;
      }

      emptyContainer.classList.add('d-none');
      activeContainer.classList.remove('d-none');

      const activeEvents = AppState.portal.activeEvents || [];
      const multiWrap = document.getElementById('portal-multi-event-selector-wrap');
      const selectEv = document.getElementById('portal-select-evento');

      if (activeEvents.length > 1 && selectEv) {
        multiWrap.classList.remove('d-none');
        const currentSelectedId = AppState.portal.activeEvent.ID_EVENTO;
        selectEv.innerHTML = activeEvents
          .map(
            (ev) =>
              `<option value="${escapeHtml(ev.ID_EVENTO)}" ${
                ev.ID_EVENTO === currentSelectedId ? 'selected' : ''
              }>${escapeHtml(ev.TITULO)} (${formatDateBr(ev.DATA_EVENTO)})</option>`
          )
          .join('');
        initAllSelect2();
      } else if (multiWrap) {
        multiWrap.classList.add('d-none');
      }

      populateActiveEventCard(AppState.portal.activeEvent);
    }

    /**
     * Avalia no cliente se a janela de check-in (1 hora antes do início do evento)
     * já está liberada, mantendo sincronia com a regra do backend.
     * @param {Object} ev Objeto de evento.
     * @returns {{isOpen: boolean, releaseDateBr: string, releaseTime: string, lockMessage: string}}
     */
    function evaluateEventCheckInWindowClient(ev) {
      if (!ev || !ev.DATA_EVENTO) {
        return {
          isOpen: false,
          releaseDateBr: '—',
          releaseTime: '—',
          lockMessage: 'Nenhuma reunião selecionada.'
        };
      }

      const mDate = String(ev.DATA_EVENTO).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const mTime = String(ev.HORA_EVENTO || '00:00').trim().match(/^(\d{2}):(\d{2})$/);
      if (!mDate) {
        return ev.CHECKIN_WINDOW || {
          isOpen: false,
          releaseDateBr: '—',
          releaseTime: '—',
          lockMessage: 'Data da reunião inválida.'
        };
      }

      const evY = Number(mDate[1]);
      const evM = Number(mDate[2]);
      const evD = Number(mDate[3]);
      const evH = mTime ? Number(mTime[1]) : 0;
      const evMin = mTime ? Number(mTime[2]) : 0;

      const eventWallMs = Date.UTC(evY, evM - 1, evD, evH, evMin, 0);
      const releaseWallMs = eventWallMs - 60 * 60 * 1000;

      const now = new Date();
      const nowWallMs = Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        now.getHours(),
        now.getMinutes(),
        0
      );

      const relObj = new Date(releaseWallMs);
      const relD = String(relObj.getUTCDate()).padStart(2, '0');
      const relM = String(relObj.getUTCMonth() + 1).padStart(2, '0');
      const relY = String(relObj.getUTCFullYear());
      const relH = String(relObj.getUTCHours()).padStart(2, '0');
      const relMin = String(relObj.getUTCMinutes()).padStart(2, '0');

      const releaseDateBr = `${relD}/${relM}/${relY}`;
      const releaseTime = `${relH}:${relMin}`;
      const isOpen = nowWallMs >= releaseWallMs;

      return {
        isOpen,
        releaseDateBr,
        releaseTime,
        lockMessage: isOpen
          ? 'Credenciamento liberado.'
          : `O credenciamento de presença (check-in) está bloqueado e será liberado somente 1 hora antes da reunião (${releaseDateBr} a partir das ${releaseTime}h).`
      };
    }

    /**
     * Resolve o link de localização (Google Maps / Waze) do evento:
     * utiliza o LINK_MAPA cadastrado pelo administrador ou gera automaticamente
     * a URL de busca do Google Maps a partir do endereço (LOCAL).
     * @param {Object} ev Objeto de evento.
     * @returns {string} URL de localização.
     */
    function resolveEventMapUrl(ev) {
      if (!ev) return 'https://www.google.com/maps';
      const customLink = String(ev.LINK_MAPA || '').trim();
      const lowerLink = customLink.toLowerCase();
      if (
        (lowerLink.indexOf('http://') === 0 || lowerLink.indexOf('https://') === 0) &&
        customLink.indexOf(' ') === -1
      ) {
        return customLink;
      }
      const query = String(ev.LOCAL || 'Campinas SP').trim();
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
    }

    /**
     * Retorna a URL base canônica do Web App para composição de links externos (WhatsApp / QR Code).
     * @returns {string}
     */
    function getWebAppBaseUrl() {
      return (
        (AppState.portal.metadata && AppState.portal.metadata.webAppUrl) ||
        window.location.href.split('?')[0]
      );
    }

    /**
     * Retorna o dia da semana por extenso em português a partir de uma data ISO (YYYY-MM-DD).
     * @param {string} isoDateStr Data no formato YYYY-MM-DD.
     * @returns {string}
     */
    function getWeekdayNamePtBr(isoDateStr) {
      if (!isoDateStr || !/^\d{4}-\d{2}-\d{2}$/.test(String(isoDateStr).trim())) {
        return 'dia da reunião';
      }
      const [y, m, d] = String(isoDateStr)
        .trim()
        .split('-')
        .map((n) => parseInt(n, 10));
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      const dias = [
        'domingo',
        'segunda-feira',
        'terça-feira',
        'quarta-feira',
        'quinta-feira',
        'sexta-feira',
        'sábado'
      ];
      return dias[dt.getDay()] || 'dia da reunião';
    }

    /**
     * Normaliza um telefone brasileiro para o formato internacional exigido pela API Web do WhatsApp (55 + DDD + Número).
     * @param {string} rawPhone Telefone informado.
     * @returns {string} Dígitos com DDI 55 ou string vazia se inválido.
     */
    function normalizeWhatsappPhoneBr(rawPhone) {
      const digits = String(rawPhone || '').replace(/\D/g, '');
      if (digits.length === 10 || digits.length === 11) {
        return `55${digits}`;
      }
      if ((digits.length === 12 || digits.length === 13) && digits.startsWith('55')) {
        return digits;
      }
      return '';
    }

    const WA_ICONS = {
      check: String.fromCodePoint(0x2705),
      pin: String.fromCodePoint(0x1f4cc),
      calendar: String.fromCodePoint(0x1f4c5),
      clock: String.fromCodePoint(0x1f552),
      coffee: String.fromCodePoint(0x2615),
      loc: String.fromCodePoint(0x1f4cd),
      map: String.fromCodePoint(0x1f5fa, 0xfe0f),
      user: String.fromCodePoint(0x1f464),
      city: String.fromCodePoint(0x1f3d9, 0xfe0f),
      role: String.fromCodePoint(0x1f4bc),
      key: String.fromCodePoint(0x1f511),
      phone: String.fromCodePoint(0x1f4f2),
      point: String.fromCodePoint(0x1f449),
      nl: String.fromCharCode(10)
    };

    /**
     * Constrói a URL oficial da API Web do WhatsApp (`https://api.whatsapp.com/send`).
     * @param {string} message Texto da mensagem.
     * @param {string} [phoneWithDdi=''] Número com DDI (ex: 5519999999999). Se vazio, permite escolher o contato/grupo.
     * @returns {string}
     */
    function buildWhatsappApiUrl(message, phoneWithDdi = '') {
      const encodedText = encodeURIComponent(String(message || ''));
      const cleanPhone = String(phoneWithDdi || '').replace(/\D/g, '');
      if (cleanPhone) {
        return (
          'https://api.whatsapp.com/send?phone=' +
          encodeURIComponent(cleanPhone) +
          '&text=' +
          encodedText
        );
      }
      return 'https://api.whatsapp.com/send?text=' + encodedText;
    }

    /**
     * Submete o formulário público de inscrição após validação e confirmação via SweetAlert2.
     * @param {Event} event Evento de submit.
     */
    async function handlePublicInscriptionSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;

      const formValid = FormAccessibilityBridge.validateFormAll(form);
      const contactValid = validateEitherEmailOrPhone('pub-email', 'pub-telefone', 10);

      if (!formValid || !contactValid) {
        toastr.warning('Preencha os campos obrigatórios e informe pelo menos um contato (E-mail ou Telefone).');
        return;
      }

      const payload = {
        ID_EVENTO: document.getElementById('pub-id-evento').value.trim(),
        NOME_COMPLETO: document.getElementById('pub-nome').value.trim(),
        CIDADE: jQuery('#pub-cidade').val() || '',
        FUNCAO: jQuery('#pub-funcao').val() || '',
        EMAIL: document.getElementById('pub-email').value.trim(),
        TELEFONE: document.getElementById('pub-telefone').value.trim(),
        ACEITE_LGPD: document.getElementById('pub-lgpd').checked,
        AUTO_CHECKIN_NOW: document.getElementById('pub-auto-checkin-now').value === 'true'
      };

      const confirmResult = await Swal.fire({
        title: payload.AUTO_CHECKIN_NOW
          ? 'Confirmar Inscrição e Presença?'
          : 'Confirmar Dados de Inscrição?',
        html: `
          <div class="text-start small">
            <p class="mb-2">Confira seus dados antes de gerar sua credencial:</p>
            <ul class="mb-0">
              <li><strong>Nome:</strong> ${escapeHtml(payload.NOME_COMPLETO)}</li>
              <li><strong>Cidade:</strong> ${escapeHtml(payload.CIDADE)}</li>
              <li><strong>Função:</strong> ${escapeHtml(payload.FUNCAO)}</li>
              <li><strong>E-mail:</strong> ${escapeHtml(payload.EMAIL || 'Não informado')}</li>
              <li><strong>Telefone:</strong> ${escapeHtml(payload.TELEFONE || 'Não informado')}</li>
            </ul>
          </div>
        `,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#033D60',
        cancelButtonColor: '#49656C',
        confirmButtonText: 'Sim, Confirmar',
        cancelButtonText: 'Revisar Dados'
      });

      if (!confirmResult.isConfirmed) return;

      try {
        setLoading(true, 'Registrando inscrição e gerando credencial QR Code...');
        const response = await callServerRpc('apiSubmitPublicInscription', payload);
        setLoading(false);

        if (response.inscricao && response.evento) {
          saveDeviceCredential(response.evento.ID_EVENTO, response.inscricao.ID_INSCRICAO);
        }

        AppState.portal.lastVoucher = response;
        renderVoucherScreen(response);

        playBeepSound('success');
        toastr.success(response.message);
        const swalRes = await Swal.fire({
          title: 'Credencial Emitida!',
          text: response.message,
          icon: 'success',
          showDenyButton: true,
          confirmButtonColor: '#033D60',
          denyButtonColor: '#198754',
          confirmButtonText: 'Ver Meu QR Code',
          denyButtonText: '<i class="bi bi-whatsapp me-1"></i>Enviar p/ Meu WhatsApp'
        });
        if (swalRes.isDenied) {
          sendVoucherToParticipantWhatsapp(response);
        }
      } catch (err) {
        setLoading(false);
        toastr.error(err.message);
        Swal.fire({
          title: 'Não foi possível concluir',
          text: err.message,
          icon: 'error',
          confirmButtonColor: '#DC3C00'
        });
      }
    }

      if (inscricao.PRESENCA_CONFIRMADA) {
        statusBadge.textContent = 'PRESENÇA CONFIRMADA NO EVENTO';
        statusBadge.className = 'badge-ccb-ativo mb-2 d-inline-block';
        presencaInfo.textContent = `✓ Check-in de presença confirmado em: ${formatTimestampBr(
          inscricao.DATA_HORA_PRESENCA
        )}`;
        presencaInfo.classList.remove('d-none');
      } else {
        statusBadge.textContent = 'INSCRIÇÃO CONFIRMADA • AGUARDANDO CHECK-IN';
        statusBadge.className = 'badge-ccb-ativo mb-2 d-inline-block';
        presencaInfo.classList.add('d-none');

    /**
     * Envia os dados da inscrição e o link direto da Credencial QR Code para o WhatsApp
     * do próprio participante utilizando a API Web do WhatsApp (`https://api.whatsapp.com/send`).
     *
     * @param {Object} voucherData Objeto contendo `{ inscricao, evento }`.
     */
    async function sendVoucherToParticipantWhatsapp(voucherData) {
      if (!voucherData || !voucherData.inscricao) {
        toastr.warning('Nenhuma inscrição selecionada para envio ao WhatsApp.');
        return;
      }

      const { inscricao, evento } = voucherData;
      const baseUrl = getWebAppBaseUrl();
      const credencialUrl = `${baseUrl}?view=portal&credencial=${encodeURIComponent(
        inscricao.ID_INSCRICAO
      )}`;
      const checkinUrl =
        evento && evento.ID_EVENTO
          ? `${baseUrl}?view=checkin&evento=${encodeURIComponent(evento.ID_EVENTO)}`
          : `${baseUrl}?view=checkin`;

      const tituloEv = evento && evento.TITULO ? evento.TITULO : 'Reunião Geral da CNS';
      const dataEv =
        evento && evento.DATA_EVENTO
          ? `${formatDateBr(evento.DATA_EVENTO)} (${getWeekdayNamePtBr(evento.DATA_EVENTO)})`
          : '—';
      const horaEv = evento && evento.HORA_EVENTO ? `${evento.HORA_EVENTO}h` : '—';
      const lancheEv = evento && evento.HORA_LANCHE ? `${evento.HORA_LANCHE}h` : '—';
      const localEv = evento && evento.LOCAL ? evento.LOCAL : '—';
      const mapUrl = resolveEventMapUrl(evento);

      const message = [
        '*CONGREGAÇÃO CRISTÃ NO BRASIL*',
        '*Agenda CNS — Regional Campinas/SP*',
        `${WA_ICONS.check} *COMPROVANTE DE INSCRIÇÃO E CREDENCIAL QR CODE*`,
        '',
        `A Paz de Deus, *${inscricao.NOME_COMPLETO}*!`,
        'Sua inscrição foi registrada com sucesso. Confira abaixo os dados da sua convocação e o link direto do seu QR Code:',
        '',
        `${WA_ICONS.pin} *Reunião:* ${tituloEv}`,
        `${WA_ICONS.calendar} *Data:* ${dataEv}`,
        `${WA_ICONS.clock} *Início da Reunião:* ${horaEv}`,
        `${WA_ICONS.coffee} *Lanche / Recepção:* ${lancheEv}`,
        `${WA_ICONS.loc} *Local:* ${localEv}`,
        `${WA_ICONS.map} *Mapa:* ${mapUrl}`,
        '',
        `${WA_ICONS.user} *Participante:* ${inscricao.NOME_COMPLETO}`,
        `${WA_ICONS.city} *Cidade:* ${inscricao.CIDADE || '—'}`,
        `${WA_ICONS.role} *Função:* ${inscricao.FUNCAO || '—'}`,
        `${WA_ICONS.key} *Código UUID:* ${inscricao.ID_INSCRICAO}`,
        '',
        `${WA_ICONS.phone} *ABRIR MEU QR CODE DE CREDENCIAMENTO:*`,
        credencialUrl,
        '',
        `${WA_ICONS.loc} *Link de Auto Check-in Online (no dia da reunião):*`,
        checkinUrl
      ].join(WA_ICONS.nl);

      let phoneWithDdi = normalizeWhatsappPhoneBr(inscricao.TELEFONE);

      if (!phoneWithDdi) {
        const promptRes = await Swal.fire({
          title: 'Enviar Comprovante para WhatsApp',
          html: `
            <div class="text-start small mb-2">
              Informe o número do WhatsApp com DDD para enviar diretamente a credencial e o link do QR Code (ou deixe em branco para selecionar o contato no WhatsApp):
            </div>
          `,
          input: 'tel',
          inputPlaceholder: '(19) 99999-9999',
          showCancelButton: true,
          confirmButtonColor: '#198754',
          cancelButtonColor: '#49656C',
          confirmButtonText: '<i class="bi bi-whatsapp me-1"></i>Abrir WhatsApp',
          cancelButtonText: 'Cancelar'
        });

        if (!promptRes.isConfirmed) return;
        phoneWithDdi = normalizeWhatsappPhoneBr(promptRes.value || '');
      }

      const waUrl = buildWhatsappApiUrl(message, phoneWithDdi);
      window.open(waUrl, '_blank', 'noopener,noreferrer');
    }

    /**
     * Faz o download da imagem PNG do QR Code gerado em qualquer container.
     * @param {string} containerId ID do elemento contendo o QR Code.
     * @param {string} filenamePrefix Prefixo do arquivo PNG.
     */
    function downloadQrCodeFromContainer(containerId, filenamePrefix = 'QRCode_CNS') {
      const qrBox = document.getElementById(containerId);
      if (!qrBox) return;

      const img = qrBox.querySelector('img');
      const canvas = qrBox.querySelector('canvas');
      let dataUrl = '';

      if (canvas) {
        dataUrl = canvas.toDataURL('image/png');
      } else if (img && img.src) {
        dataUrl = img.src;
      }

      if (!dataUrl) {
        toastr.warning('Aguarde a renderização do QR Code antes de baixar.');
        return;
      }

      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = `${filenamePrefix}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      toastr.success('Download do QR Code iniciado.');
    }

    /* ========================================================================
     * ROTA 2: AUTO-CREDENCIAMENTO ONLINE DO PARTICIPANTE (SELF CHECK-IN)
     * ======================================================================== */
    async function renderSelfCheckinView() {
      const emptyCard = document.getElementById('selfcheckin-empty-card');
      const activeCard = document.getElementById('selfcheckin-active-card');

      if (!AppState.portal.hasActiveEvent || !AppState.portal.activeEvent) {
        activeCard.classList.add('d-none');
        emptyCard.classList.remove('d-none');
        return;
      }

      emptyCard.classList.add('d-none');
      activeCard.classList.remove('d-none');

      const ev = AppState.portal.activeEvent;
      document.getElementById('sc-ev-titulo').textContent = ev.TITULO || '—';
      document.getElementById('sc-ev-data').textContent = formatDateBr(ev.DATA_EVENTO);
      document.getElementById('sc-ev-hora').textContent = ev.HORA_EVENTO ? `${ev.HORA_EVENTO}h` : '—';
      document.getElementById('sc-ev-local').textContent = ev.LOCAL || '—';
      const scMapLink = document.getElementById('sc-ev-map-link');
      if (scMapLink) {
        scMapLink.href = resolveEventMapUrl(ev);
      }

      const lockedBox = document.getElementById('sc-locked-window-box');
      const autoBox = document.getElementById('sc-auto-detected-box');
      const manualBox = document.getElementById('sc-manual-form-box');
      const footerNotReg = document.getElementById('sc-not-registered-footer');
      const headerBadge = document.getElementById('sc-header-status-badge');

      const win = evaluateEventCheckInWindowClient(ev);
      if (!win.isOpen) {
        if (headerBadge) {
          headerBadge.className = 'badge-ccb-pendente';
          headerBadge.textContent = 'CHECK-IN BLOQUEADO';
        }
        const msgEl = document.getElementById('sc-locked-window-msg');
        const dtEl = document.getElementById('sc-locked-release-datetime');
        if (msgEl) {
          msgEl.textContent = win.lockMessage;
        }
        if (dtEl) {
          dtEl.textContent = `${win.releaseDateBr} às ${win.releaseTime}h`;
        }
        if (lockedBox) lockedBox.classList.remove('d-none');
        if (autoBox) autoBox.classList.add('d-none');
        if (manualBox) manualBox.classList.add('d-none');
        if (footerNotReg) footerNotReg.classList.add('d-none');
        return;
      }

      if (headerBadge) {
        headerBadge.className = 'badge-ccb-ativo';
        headerBadge.textContent = 'CHECK-IN LIBERADO';
      }
      if (lockedBox) lockedBox.classList.add('d-none');
      if (footerNotReg) footerNotReg.classList.remove('d-none');

      // Verifica automaticamente Conta Google logada ou Credencial salva no aparelho
      const savedUuid = getDeviceCredential(ev.ID_EVENTO);

      if (AppState.portal.googleSessionMatch) {
        showAutoDetectedParticipant(AppState.portal.googleSessionMatch, 'GOOGLE_ACCOUNT');
        return;
      }

      try {
        const matchRes = await callServerRpc(
          'apiCheckParticipantAutoMatch',
          ev.ID_EVENTO,
          savedUuid
        );
        if (matchRes && matchRes.found && matchRes.candidate) {
          showAutoDetectedParticipant(matchRes.candidate, matchRes.source);
        } else {
          document.getElementById('sc-auto-detected-box').classList.add('d-none');
          document.getElementById('sc-manual-form-box').classList.remove('d-none');
        }
      } catch (_) {
        document.getElementById('sc-auto-detected-box').classList.add('d-none');
        document.getElementById('sc-manual-form-box').classList.remove('d-none');
      }
    }

    /**
     * Exibe o cartão de confirmação em 1 clique quando a Conta Google ou o Dispositivo é reconhecido.
     * @param {Object} candidate Dados resumidos do participante.
     * @param {string} source 'GOOGLE_ACCOUNT' | 'DEVICE_CREDENTIAL'
     */
    function showAutoDetectedParticipant(candidate, source) {
      AppState.portal.autoMatchCandidate = candidate;
      AppState.portal.autoMatchSource = source;

      const box = document.getElementById('sc-auto-detected-box');
      const badge = document.getElementById('sc-auto-source-badge');
      const nomeEl = document.getElementById('sc-auto-nome');
      const detEl = document.getElementById('sc-auto-detalhes');
      const alreadyMsg = document.getElementById('sc-auto-already-msg');
      const btnConfirm = document.getElementById('btn-sc-oneclick-confirm');

      badge.textContent =
        source === 'GOOGLE_ACCOUNT'
          ? `Conta Google Reconhecida (${candidate.EMAIL_MASKED || 'Logado'})`
          : 'Credencial deste Aparelho Reconhecida';

      nomeEl.textContent = candidate.NOME_COMPLETO;
      detEl.textContent = `${candidate.CIDADE} • ${candidate.FUNCAO}`;

      if (candidate.PRESENCA_CONFIRMADA) {
        alreadyMsg.classList.remove('d-none');
        btnConfirm.innerHTML = '<i class="bi bi-qr-code me-1"></i>Visualizar Meu Comprovante de Presença';
      } else {
        alreadyMsg.classList.add('d-none');
        btnConfirm.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Confirmar Minha Presença Agora (1 Clique)';
      }

      box.classList.remove('d-none');
    }

    /**
     * Executa o Auto Check-in com 1 clique (via Conta Google ou Credencial salva no aparelho).
     */
    async function handleOneClickSelfCheckin() {
      const ev = AppState.portal.activeEvent;
      const cand = AppState.portal.autoMatchCandidate;
      if (!ev || !cand) return;

      try {
        setLoading(true, 'Confirmando sua presença na reunião...');
        const response = await callServerRpc('apiSubmitOnlineSelfCheckIn', {
          ID_EVENTO: ev.ID_EVENTO,
          METHOD: AppState.portal.autoMatchSource,
          ID_INSCRICAO: cand.ID_INSCRICAO
        });
        setLoading(false);

        saveDeviceCredential(ev.ID_EVENTO, response.inscricao.ID_INSCRICAO);
        AppState.portal.lastVoucher = response;
        renderVoucherScreen(response);

        playBeepSound('success');
        toastr.success(response.message);

        Swal.fire({
          title: response.alreadyCheckedIn ? 'Presença Já Registrada!' : 'Presença Confirmada!',
          text: response.message,
          icon: 'success',
          confirmButtonColor: '#033D60'
        });
      } catch (err) {
        setLoading(false);

    }

    /**
     * Executa o Auto Check-in validando o campo selecionado no selectbox (E-mail ou Telefone).
     * @param {Event} event Submit event.
     */
    async function handleManualSelfCheckinSubmit(event) {
      event.preventDefault();

      const tipoValidacao = jQuery('#sc-tipo-validacao').val() || 'EMAIL';
      const emailEl = document.getElementById('sc-email');
      const phoneEl = document.getElementById('sc-telefone');
      const wrapEmail = document.getElementById('wrap-sc-email');
      const wrapPhone = document.getElementById('wrap-sc-telefone');

      let email = '';
      let telefone = '';

      if (tipoValidacao === 'EMAIL') {
        email = emailEl ? emailEl.value.trim() : '';
        const emailValid = email.length > 0 && /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
        if (!emailValid) {
          if (wrapEmail) wrapEmail.classList.add('has-error');
          if (emailEl) {
            emailEl.setAttribute('aria-invalid', 'true');
            emailEl.focus();
          }
          toastr.warning('Informe um endereço de e-mail válido cadastrado na inscrição.');
          return;
        }
        if (wrapEmail) wrapEmail.classList.remove('has-error');
        if (emailEl) emailEl.removeAttribute('aria-invalid');
      } else {
        telefone = phoneEl ? phoneEl.value.trim() : '';
        const digits = telefone.replace(/\D/g, '');
        if (digits.length < 4) {
          if (wrapPhone) wrapPhone.classList.add('has-error');
          if (phoneEl) {
            phoneEl.setAttribute('aria-invalid', 'true');
            phoneEl.focus();
          }
          toastr.warning('Informe o telefone cadastrado ou os 4 últimos dígitos.');
          return;
        }
        if (wrapPhone) wrapPhone.classList.remove('has-error');
        if (phoneEl) phoneEl.removeAttribute('aria-invalid');
      }

      const ev = AppState.portal.activeEvent;
      if (!ev) return;

      try {
        setLoading(true, 'Validando dados de inscrição e confirmando presença...');
        const response = await callServerRpc('apiSubmitOnlineSelfCheckIn', {
          ID_EVENTO: ev.ID_EVENTO,
          METHOD: 'EMAIL_PHONE',
          EMAIL: email,
          TELEFONE: telefone
        });
        setLoading(false);

        saveDeviceCredential(ev.ID_EVENTO, response.inscricao.ID_INSCRICAO);
        AppState.portal.lastVoucher = response;
        renderVoucherScreen(response);

        playBeepSound('success');
        toastr.success(response.message);

        Swal.fire({
          title: response.alreadyCheckedIn ? 'Presença Já Confirmada!' : 'Presença Confirmada com Sucesso!',
          html: `
            <div class="fw-bold fs-5 mb-1" style="color: #033D60;">${escapeHtml(
              response.inscricao.NOME_COMPLETO
            )}</div>
            <div class="small text-secondary">${escapeHtml(
              response.inscricao.CIDADE
            )} &bull; ${escapeHtml(response.inscricao.FUNCAO)}</div>
          `,
          icon: 'success',
          confirmButtonColor: '#033D60'
        });
      } catch (err) {
        setLoading(false);
        playBeepSound('error');
        toastr.error(err.message);
        Swal.fire({
          title: 'Não foi possível validar',
          text: err.message,
          icon: 'warning',
          confirmButtonColor: '#033D60'
        });
      }
    }

    /* ========================================================================
     * PAINEL ADMINISTRATIVO: AUTENTICAÇÃO E SINCRONIZAÇÃO DE DADOS
     * ======================================================================== */
    async function handleAdminLoginSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      if (!FormAccessibilityBridge.validateFormAll(form)) {
        return;
      }

      const secretInput = document.getElementById('admin-secret-input');
      const candidateSecret = secretInput.value.trim();

      try {
        setLoading(true, 'Verificando credenciais administrativas...');
        const bundle = await callServerRpc('apiAdminAuthenticateAndLoad', candidateSecret, 'ALL');

        AppState.admin.authenticated = true;
        AppState.admin.secret = candidateSecret;
        AppState.admin.filterEventoId = 'ALL';

        document.getElementById('admin-auth-gate').classList.add('d-none');
        document.getElementById('admin-workspace').classList.remove('d-none');

        applyAdminBundle(bundle);
        toastr.success('Acesso administrativo liberado com sucesso.');
      } catch (err) {
        setLoading(false);
        toastr.error(err.message);
        Swal.fire({
          title: 'Falha de Autenticação',
          text: err.message,
          icon: 'error',
          confirmButtonColor: '#DC3C00'
        });
      } finally {
        setLoading(false);
      }
    }

    async function reloadAdminDashboardData(filterId) {

    /**
     * Aplica o pacote completo retornado pelo AdminService em todas as 4 abas.
     * @param {Object} bundle Pacote de dados administrativos.
     */
    function applyAdminBundle(bundle) {
      if (!bundle) return;
      AppState.admin.bundle = bundle;
      AppState.admin.filterEventoId = bundle.filterEventoId || 'ALL';
      if (bundle.metadata) {
        AppState.portal.metadata = bundle.metadata;
      }

      const todayIso = new Date().toISOString().slice(0, 10);
      const activeList = (bundle.eventos || []).filter(
        (ev) => ev.STATUS === 'ATIVO' && ev.DATA_EVENTO >= todayIso
      );
      AppState.portal.activeEvents = activeList;
      AppState.portal.activeEvent = activeList.length > 0 ? activeList[0] : null;
      AppState.portal.hasActiveEvent = activeList.length > 0;

      populateAdminEventSelects(bundle.eventos || [], AppState.admin.filterEventoId);
      renderDashboardKpisAndTables(bundle);
      renderDashboardCharts(bundle);
      renderEventosTable(bundle.eventos || []);
      renderInscricoesTable();
    }

    function populateAdminEventSelects(eventos, activeFilter) {

                }>${escapeHtml(ev.TITULO)} (${formatDateBr(ev.DATA_EVENTO)} - ${escapeHtml(ev.STATUS)})</option>`
            )

      }

      const insFilterEv = document.getElementById('ins-filter-evento');
      if (insFilterEv) {
        const currentInsEv = jQuery(insFilterEv).val() || 'ALL';

          '<option value="ALL">Todas as Reuniões</option>' +
          eventos

                }>${escapeHtml(ev.TITULO)} (${formatDateBr(ev.DATA_EVENTO)})</option>`

      if (checkinEv) {

        checkinEv.innerHTML =
          '<option value="ALL">Qualquer Reunião Cadastrada (Reconhecimento Automático)</option>' +
          eventos
            .map(
              (ev) =>

                  ev.ID_EVENTO === currentCheckinEv ? 'selected' : ''
                }>${escapeHtml(ev.TITULO)} (${formatDateBr(ev.DATA_EVENTO)})</option>`

    /* ========================================================================
     * ABA 1: DASHBOARDS, GRÁFICOS (CHART.JS) E EXPORTAÇÃO (XLSX / PDF)
     * ======================================================================== */
    function renderDashboardKpisAndTables(bundle) {
      const kpis = bundle.kpis || {
        totalInscricoes: 0,
        totalPresencas: 0,
        taxaPresenca: 0,
        totalReunioes: 0
      };

      document.getElementById('kpi-total-inscricoes').textContent = kpis.totalInscricoes;
      document.getElementById('kpi-total-presencas').textContent = kpis.totalPresencas;
      document.getElementById('kpi-taxa-presenca').textContent = `${kpis.taxaPresenca}%`;
      document.getElementById('kpi-total-reunioes').textContent = kpis.totalReunioes;

      const printTs = document.getElementById('print-report-timestamp');
      if (printTs) {
        printTs.textContent = formatTimestampBr(bundle.generatedAt);
      }

      const cidadesChart = (bundle.charts && bundle.charts.cidades) || {
        labels: [],
        inscritos: [],
        presentes: []
      };

      const tbody = document.getElementById('dashboard-cidades-tbody');
      if (!tbody) return;

      const rowsHtml = cidadesChart.labels.map((cidade, idx) => {
        const ins = cidadesChart.inscritos[idx] || 0;
        const pres = cidadesChart.presentes[idx] || 0;
        const aus = Math.max(0, ins - pres);
        const pct = ins > 0 ? ((pres / ins) * 100).toFixed(1) : '0.0';

        return `
          <tr>
            <td class="fw-bold">${escapeHtml(cidade)}</td>
            <td class="text-center">${ins}</td>
            <td class="text-center fw-bold" style="color: #438E76;">${pres}</td>
            <td class="text-center text-secondary">${aus}</td>
            <td class="text-center"><span class="badge ${
              Number(pct) >= 70 ? 'badge-ccb-ativo' : 'badge-ccb-encerrado'
            }">${pct}%</span></td>
          </tr>
        `;
      });

      tbody.innerHTML = rowsHtml.join('');
    }

    /**

        toastr.warning('Dados ainda não carregados para exportação.');
        return;
      }

      const bundle = AppState.admin.bundle;
      const wb = XLSX.utils.book_new();

      const kpiRows = [
        ['CONGREGAÇÃO CRISTÃ NO BRASIL (CCB) - REGIONAL CAMPINAS/SP'],
        ['COMISSÃO DE NEGOCIADORES DE SUPRIMENTOS (CNS) - RELATÓRIO OFICIAL'],
        ['Logotipo CCB (Drive)', Environment.LOGOS ? Environment.LOGOS.CCB_PRIMARY_URL : 'https://drive.google.com/file/d/13etuen5crQ5e66EVMRJp4cHrYWRXsREM/view'],
        ['Logotipo CNS (Drive)', Environment.LOGOS ? Environment.LOGOS.CNS_PRIMARY_URL : 'https://drive.google.com/file/d/11cfotJKM6DCDD3HUk99kboHWLHG2v0ah/view'],
        ['Data de Geração', formatTimestampBr(bundle.generatedAt)],
        ['Escopo do Filtro', bundle.filterEventoId === 'ALL' ? 'Consolidado Histórico' : bundle.filterEventoId],
        [],
        ['INDICADOR (KPI)', 'VALOR'],
        ['Total de Inscrições', bundle.kpis.totalInscricoes],
        ['Presenças Confirmadas no Local', bundle.kpis.totalPresencas],
        ['Taxa de Presença (%)', `${bundle.kpis.taxaPresenca}%`],
        ['Total de Reuniões Catalogadas', bundle.kpis.totalReunioes],
        [],
        ['DISTRIBUIÇÃO POR CIDADE (REGIONAL CAMPINAS)', 'INSCRITOS', 'PRESENTES', 'AUSENTES']
      ];

      bundle.charts.cidades.labels.forEach((cidade, i) => {
        const ins = bundle.charts.cidades.inscritos[i] || 0;
        const pres = bundle.charts.cidades.presentes[i] || 0;
        kpiRows.push([cidade, ins, pres, Math.max(0, ins - pres)]);
      });

      const wsKpi = XLSX.utils.aoa_to_sheet(kpiRows);
      XLSX.utils.book_append_sheet(wb, wsKpi, 'Indicadores_CNS');

      const inscricoesExport = (bundle.inscricoesFiltradas || []).map((ins) => ({
        ID_INSCRICAO: ins.ID_INSCRICAO,
        ID_EVENTO: ins.ID_EVENTO,
        REUNIAO: ins.EVENTO_TITULO,
        DATA_REUNIAO: formatDateBr(ins.EVENTO_DATA),
        NOME_COMPLETO: ins.NOME_COMPLETO,
        CIDADE: ins.CIDADE,
        FUNCAO: ins.FUNCAO,
        ACEITE_LGPD: ins.ACEITE_LGPD ? 'SIM' : 'NÃO',
        DATA_HORA_ACEITE: ins.DATA_HORA_ACEITE,
        PRESENCA_CONFIRMADA: ins.PRESENCA_CONFIRMADA ? 'SIM' : 'NÃO',
        DATA_HORA_PRESENCA: ins.DATA_HORA_PRESENCA
      }));

      const wsInscricoes = XLSX.utils.json_to_sheet(
        inscricoesExport.length > 0
          ? inscricoesExport
          : [{ AVISO: 'Nenhuma inscrição encontrada para o filtro selecionado.' }]
      );
      XLSX.utils.book_append_sheet(wb, wsInscricoes, 'Inscricoes');

      const eventosExport = (bundle.eventos || []).map((ev) => ({
        ID_EVENTO: ev.ID_EVENTO,
        TITULO: ev.TITULO,
        DATA_EVENTO: formatDateBr(ev.DATA_EVENTO),
        HORA_EVENTO: ev.HORA_EVENTO,
        HORA_LANCHE: ev.HORA_LANCHE,
        LOCAL: ev.LOCAL,
        STATUS: ev.STATUS,
        INSCRITOS: ev.TOTAL_INSCRITOS || 0,
        PRESENTES: ev.TOTAL_PRESENTES || 0
      }));

      const wsEventos = XLSX.utils.json_to_sheet(
        eventosExport.length > 0 ? eventosExport : [{ AVISO: 'Nenhuma reunião cadastrada.' }]
      );
      XLSX.utils.book_append_sheet(wb, wsEventos, 'Eventos');

      const fileDate = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `Relatorio_Agenda_CNS_Campinas_${fileDate}.xlsx`);
      toastr.success('Planilha Excel (.xlsx) exportada com sucesso!');
    }

    /**
     * Exporta qualquer card (Gráfico ou Tabela) em formato de imagem PNG de alta resolução.
     * Utiliza html2canvas para capturar o cabeçalho institucional CCB e o conteúdo completo
     * do gráfico ou tabela, omitindo automaticamente botões de ação (.no-export-png).
     *
     * @param {HTMLElement} buttonEl Botão acionado no cabeçalho do card.
     */
    async function exportCardElementToPng(buttonEl) {
      if (!buttonEl) return;
      const targetCardId = buttonEl.getAttribute('data-target-card');
      const targetCanvasId = buttonEl.getAttribute('data-target-canvas');
      const filenamePrefix = buttonEl.getAttribute('data-filename') || 'Relatorio_CNS';
      const cardEl = targetCardId ? document.getElementById(targetCardId) : null;

      if (!cardEl) {
        toastr.warning('Elemento não encontrado para exportação.');
        return;
      }

      const originalHtml = buttonEl.innerHTML;
      buttonEl.disabled = true;
      buttonEl.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Exportando...';

      try {
        let dataUrl = '';

        if (window.html2canvas) {
          const renderedCanvas = await window.html2canvas(cardEl, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#FFFFFF',
            logging: false,
            ignoreElements: (el) =>
              Boolean(el && el.classList && el.classList.contains('no-export-png'))
          });
          dataUrl = renderedCanvas.toDataURL('image/png');
        } else if (targetCanvasId) {
          const chartCanvas = document.getElementById(targetCanvasId);
          if (chartCanvas) {
            const outCanvas = document.createElement('canvas');
            outCanvas.width = chartCanvas.width + 48;
            outCanvas.height = chartCanvas.height + 84;
            const ctx = outCanvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
            ctx.fillStyle = '#033D60';
            ctx.fillRect(0, 0, outCanvas.width, 48);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 15px Verdana, sans-serif';
            const titleEl = cardEl.querySelector('.ccb-card-header h3');
            ctx.fillText(titleEl ? titleEl.textContent.trim() : 'Agenda CNS', 18, 30);
            ctx.drawImage(chartCanvas, 24, 64);
            dataUrl = outCanvas.toDataURL('image/png');
          }
        }

        if (!dataUrl) {
          throw new Error('Não foi possível renderizar a imagem PNG neste navegador.');
        }

        const fileDate = new Date().toISOString().slice(0, 10);
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `${filenamePrefix}_${fileDate}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        toastr.success('Imagem PNG exportada com sucesso!');
      } catch (err) {
        toastr.error(err.message || 'Erro ao exportar imagem PNG.');
      } finally {
        buttonEl.disabled = false;
        buttonEl.innerHTML = originalHtml;
      }
    }

        '',
        'Convidamos para a próxima *Reunião Geral Presencial da CNS* na Regional Campinas:',
        '• *ANCIÃES e DIÁCONOS* (Membros das Reuniões Regionais de Ensinamentos — RRE da Regional Campinas);',
        '• *Membros da Administração* de todas as Administrações que compõem a Regional de Campinas;',

        '',
        `${WA_ICONS.calendar} *Dia:* ${dataBr} (${diaSemana}, às *${horaReuniao}h*)`,
        `${WA_ICONS.coffee} *Serviço de Alimentação / Lanche:* ${horaLanche}h`,
        `${WA_ICONS.loc} *Local:* ${local}`,

    /**
     * Localiza outros eventos que estejam atualmente com status ATIVO na base carregada.
     * @param {string} [excludeId=''] UUID do evento atual a ignorar.
     * @returns {Array<Object>}
     */
    function findOtherActiveEventos(excludeId = '') {
      const cleanExclude = String(excludeId || '').trim().toLowerCase();
      const lista = (AppState.admin.bundle && AppState.admin.bundle.eventos) || [];
      return lista.filter(
        (ev) =>
          ev.STATUS === 'ATIVO' &&
          (!cleanExclude || ev.ID_EVENTO.toLowerCase() !== cleanExclude)
      );
    }

    /**
     * Submete o formulário de criação/edição de reunião.
     * Ao definir um evento como ATIVO, alerta caso já exista outro evento ATIVO que será encerrado.
     * @param {Event} event Evento de submit.
     */
    async function handleSaveEventoSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      if (!FormAccessibilityBridge.validateFormAll(form)) {
        toastr.warning('Preencha todos os campos obrigatórios da reunião.');
        return;
      }

      const linkMapaEl = document.getElementById('ev-link-mapa');
      const payload = {
        ID_EVENTO: document.getElementById('ev-id').value.trim(),
        TITULO: document.getElementById('ev-titulo').value.trim(),
        DATA_EVENTO: document.getElementById('ev-data').value.trim(),
        HORA_EVENTO: document.getElementById('ev-hora').value.trim(),
        HORA_LANCHE: document.getElementById('ev-lanche').value.trim(),
        LOCAL: document.getElementById('ev-local').value.trim(),
        LINK_MAPA: linkMapaEl ? linkMapaEl.value.trim() : '',
        STATUS: jQuery('#ev-status').val() || 'ATIVO'
      };

      const isEdit = Boolean(payload.ID_EVENTO);
      const otherActives =
        payload.STATUS === 'ATIVO' ? findOtherActiveEventos(payload.ID_EVENTO) : [];

      const activeWarningHtml =
        otherActives.length > 0
          ? `<div class="alert alert-warning text-start small mt-3 mb-0">
               <i class="bi bi-exclamation-triangle-fill me-1"></i>
               <strong>Atenção:</strong> A reunião <strong>"${escapeHtml(
                 otherActives.map((e) => `${e.TITULO} (${formatDateBr(e.DATA_EVENTO)})`).join(', ')
               )}"</strong> encontra-se atualmente como <strong>ATIVA</strong>.<br>
               Como apenas um evento pode ficar ativo por vez no Portal e no Check-in, o evento ativo anterior será automaticamente alterado para <strong>ENCERRADO</strong>.
             </div>`
          : '';

      const confirm = await Swal.fire({
        title: isEdit ? 'Salvar alterações da reunião?' : 'Confirmar criação da reunião?',
        html: `
          <div>${escapeHtml(payload.TITULO)} (${formatDateBr(payload.DATA_EVENTO)} às ${escapeHtml(
            payload.HORA_EVENTO
          )}h) &mdash; Status: <strong>${escapeHtml(payload.STATUS)}</strong></div>
          ${activeWarningHtml}
        `,
        icon: otherActives.length > 0 ? 'warning' : 'question',
        showCancelButton: true,
        confirmButtonColor: '#033D60',
        cancelButtonColor: '#49656C',
        confirmButtonText:
          otherActives.length > 0 ? 'Sim, Ativar e Encerrar Anterior' : 'Sim, Gravar',
        cancelButtonText: 'Cancelar'
      });

      if (!confirm.isConfirmed) return;

      try {
        setLoading(true, 'Salvando reunião na planilha...');
        const response = await callServerRpc(
          'apiAdminSaveEvento',
          AppState.admin.secret,
          payload,
          AppState.admin.filterEventoId
        );

        const modalEl = document.getElementById('modal-evento');
        bootstrap.Modal.getOrCreateInstance(modalEl).hide();

        applyAdminBundle(response.bundle);
        toastr.success(response.message);
      } catch (err) {
        toastr.error(err.message);
      } finally {
        setLoading(false);
      }
    }

    /**
     * Alterna o status ATIVO / ENCERRADO de uma reunião com confirmação SweetAlert2.
     * Caso vá ativar a reunião e exista outra reunião ATIVA, informa que a anterior será encerrada.
     */
    async function handleToggleEventoStatus(idEvento, nextStatus, titulo) {
      const otherActives = nextStatus === 'ATIVO' ? findOtherActiveEventos(idEvento) : [];
      const activeWarningHtml =
        otherActives.length > 0
          ? `<div class="alert alert-warning text-start small mt-3 mb-0">
               <i class="bi bi-exclamation-triangle-fill me-1"></i>
               <strong>Atenção:</strong> A reunião <strong>"${escapeHtml(
                 otherActives.map((e) => `${e.TITULO} (${formatDateBr(e.DATA_EVENTO)})`).join(', ')
               )}"</strong> está ativa no momento e será automaticamente alterada para <strong>ENCERRADO</strong>.
             </div>`
          : '';

      const confirm = await Swal.fire({
        title: `Alterar status para ${nextStatus}?`,
        html: `<div>Reunião: <strong>"${escapeHtml(titulo)}"</strong></div>${activeWarningHtml}`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#033D60',
        cancelButtonColor: '#49656C',
        confirmButtonText:
          otherActives.length > 0
            ? 'Sim, Ativar e Encerrar Anterior'
            : `Sim, definir como ${nextStatus}`,
        cancelButtonText: 'Cancelar'
      });

      if (!confirm.isConfirmed) return;

      try {
        setLoading(true, 'Atualizando status da reunião...');
        const response = await callServerRpc(
          'apiAdminUpdateEventoStatus',
          AppState.admin.secret,
          idEvento,
          nextStatus,
          AppState.admin.filterEventoId
        );
        applyAdminBundle(response.bundle);
        toastr.success(response.message);
      } catch (err) {
        toastr.error(err.message);
      } finally {
        setLoading(false);
      }
    }

    /* ========================================================================
     * ABA 3: GESTÃO DE INSCRIÇÕES (CRUD)
     * ======================================================================== */
    function renderInscricoesTable() {
      const tbody = document.getElementById('inscricoes-tbody');
      if (!tbody || !AppState.admin.bundle) return;

      const todas = AppState.admin.bundle.inscricoes || [];
      const filterEvento = jQuery('#ins-filter-evento').val() || 'ALL';
      const filterCidade = jQuery('#ins-filter-cidade').val() || 'ALL';
      const filterPresenca = jQuery('#ins-filter-presenca').val() || 'ALL';
      const searchQuery = (document.getElementById('ins-search-input').value || '').trim().toLowerCase();

      const filtradas = todas.filter((ins) => {
        if (filterEvento !== 'ALL' && ins.ID_EVENTO.toLowerCase() !== filterEvento.toLowerCase()) {
          return false;
        }
        if (filterCidade !== 'ALL' && ins.CIDADE !== filterCidade) {
          return false;
        }
        if (filterPresenca === 'PRESENTE' && !ins.PRESENCA_CONFIRMADA) {
          return false;
        }
        if (filterPresenca === 'PENDENTE' && ins.PRESENCA_CONFIRMADA) {
          return false;
        }
        if (searchQuery) {
          const matchNome = (ins.NOME_COMPLETO || '').toLowerCase().includes(searchQuery);
          const matchUuid = (ins.ID_INSCRICAO || '').toLowerCase().includes(searchQuery);
          const matchEmail = (ins.EMAIL || '').toLowerCase().includes(searchQuery);
          const matchFuncao = (ins.FUNCAO || '').toLowerCase().includes(searchQuery);
          if (!matchNome && !matchUuid && !matchEmail && !matchFuncao) return false;
        }
        return true;
      });

      if (filtradas.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center text-secondary py-4">
              Nenhum participante encontrado para os critérios de filtro selecionados.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtradas
        .map((ins) => {
          const presencaBadge = ins.PRESENCA_CONFIRMADA
            ? `<span class="badge-ccb-ativo d-inline-block"><i class="bi bi-check2-circle me-1"></i>Presente</span>
               <div class="text-secondary" style="font-size: 0.7rem;">${formatTimestampBr(ins.DATA_HORA_PRESENCA)}</div>`
            : '<span class="badge-ccb-pendente"><i class="bi bi-hourglass-split me-1"></i>Aguardando</span>';

          const lgpdBadge = ins.ACEITE_LGPD
            ? `<span class="badge bg-light text-dark border" title="Aceito em ${escapeHtml(
                formatTimestampBr(ins.DATA_HORA_ACEITE)
              )}"><i class="bi bi-shield-check text-success me-1"></i>Sim</span>`
            : '<span class="badge bg-danger">Não</span>';

          return `
            <tr>
              <td data-label="Participante">
                <div class="fw-bold">${escapeHtml(ins.NOME_COMPLETO)}</div>
                <code class="text-secondary" style="font-size: 0.72rem;">${escapeHtml(ins.ID_INSCRICAO)}</code>
              </td>
              <td data-label="Cidade">${escapeHtml(ins.CIDADE)}</td>
              <td data-label="Função">${escapeHtml(ins.FUNCAO)}</td>
              <td data-label="Reunião">
                <div class="small fw-bold">${escapeHtml(ins.EVENTO_TITULO)}</div>
                <div class="text-secondary" style="font-size: 0.72rem;">${formatDateBr(ins.EVENTO_DATA)}</div>
              </td>
              <td data-label="Contato" class="small no-export-png no-print">
                <div><i class="bi bi-envelope text-secondary me-1"></i>${escapeHtml(ins.EMAIL || '—')}</div>
                <div><i class="bi bi-telephone text-secondary me-1"></i>${escapeHtml(ins.TELEFONE || '—')}</div>
              </td>
              <td data-label="LGPD" class="text-center">${lgpdBadge}</td>
              <td data-label="Presença" class="text-center">${presencaBadge}</td>
              <td data-label="Ações" class="text-end text-nowrap no-export-png">
                <div class="btn-group btn-group-sm">
                  <button
                    type="button"
                    class="btn ${ins.PRESENCA_CONFIRMADA ? 'btn-outline-secondary' : 'btn-outline-success'} js-btn-toggle-presenca"
                    data-id="${escapeHtml(ins.ID_INSCRICAO)}"
                    data-nome="${escapeHtml(ins.NOME_COMPLETO)}"
                    data-presenca="${ins.PRESENCA_CONFIRMADA ? 'true' : 'false'}"
                    title="${ins.PRESENCA_CONFIRMADA ? 'Desmarcar Presença' : 'Confirmar Presença Manualmente'}"
                  >
                    <i class="bi ${ins.PRESENCA_CONFIRMADA ? 'bi-x-circle' : 'bi-check2-circle'}"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-primary js-btn-view-qr"
                    data-id="${escapeHtml(ins.ID_INSCRICAO)}"
                    data-nome="${escapeHtml(ins.NOME_COMPLETO)}"
                    data-detalhes="${escapeHtml(ins.CIDADE)} • ${escapeHtml(ins.FUNCAO)}"
                    title="Visualizar QR Code Individual"
                  >
                    <i class="bi bi-qr-code"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-danger js-btn-delete-inscricao"
                    data-id="${escapeHtml(ins.ID_INSCRICAO)}"
                    data-nome="${escapeHtml(ins.NOME_COMPLETO)}"
                    title="Remover Inscrição"
                  >
                    <i class="bi bi-trash3-fill"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        })
        .join('');
    }

    async function detectAvailableCameras() {

      try {
        const devices = await Html5Qrcode.getCameras();

        if (!devices || devices.length === 0) {

          '<option value="environment">Câmera Traseira / Padrão</option>' +

            .map(
              (cam, idx) =>
                `<option value="${escapeHtml(cam.id)}">${escapeHtml(

                )}</option>`
            )
            .join('');
