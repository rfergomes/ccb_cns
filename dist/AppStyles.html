<style>
  :root {
    --ccb-primary: #033D60;
    --ccb-primary-dark: #022B44;
    --ccb-white: #FFFFFF;
    --ccb-text: #201E1E;
    --ccb-gray: #CDD4DC;
    --ccb-bg-light: #F4F6F8;
    --ccb-slate: #49656C;
    --ccb-green: #5DB196;
    --ccb-green-dark: #438E76;
    --ccb-red: #DC3C00;
    --ccb-yellow: #FFCC66;
    --font-primary: Verdana, Geneva, Tahoma, sans-serif;
    color-scheme: light;
  }

  html,
  body {
    font-family: var(--font-primary);
    color: var(--ccb-text);
    background-color: var(--ccb-bg-light);
    accent-color: var(--ccb-primary);
    line-height: 1.55;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: clip;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  /* Tipografia equilibrada conforme diretrizes modernas de legibilidade */
  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  .ccb-heading-balance {
    font-family: var(--font-primary);
    color: var(--ccb-primary);
    font-weight: 700;
    text-wrap: balance;
  }

  p,
  blockquote,
  li,
  .pretty-text {
    text-wrap: pretty;
  }

  /* Cabeçalho Institucional CCB + Navegação Responsiva Única (navbar) */
  .ccb-navbar {
    background-color: var(--ccb-primary);
    color: var(--ccb-white);
    border-bottom: 3px solid var(--ccb-green);
    box-shadow: 0 2px 10px rgba(3, 61, 96, 0.16);
    padding-block: 0.7rem;
    position: relative;
    z-index: 1030;
  }

  .ccb-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.9rem;
    min-width: 0;
  }

  .ccb-header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-width: 0;
    flex: 1 1 auto;
  }

  .ccb-header-titles {
    min-width: 0;
  }

  .ccb-site-nav {
    flex-shrink: 0;
    position: relative;
  }

  .ccb-menu-button {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background-color: rgba(255, 255, 255, 0.14);
    color: var(--ccb-white);
    border: 1px solid rgba(255, 255, 255, 0.32);
    border-radius: 8px;
    padding: 0.42rem 0.75rem;
    min-height: 40px;
    font-family: var(--font-primary);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    anchor-name: --ccb-menu-button;
    transition: background-color 0.15s ease;
  }

  .ccb-menu-button:hover,
  .ccb-menu-button:focus-visible {
    background-color: rgba(255, 255, 255, 0.24);
    outline: 2px solid var(--ccb-yellow);
    outline-offset: 2px;
  }

  .ccb-site-menu {
    list-style: none;
    margin: 0;
    padding: 0.45rem;
    background-color: var(--ccb-primary-dark);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    position: fixed;
    inset: auto;
    inset-block-start: 4.5rem;
    inset-block-start: anchor(--ccb-menu-button bottom);
    inset-inline-end: 0.75rem;
    inline-size: min(84dvw, 18.5rem);
    max-inline-size: calc(100dvw - 1.5rem);
    margin-block-start: 0.4rem;
    z-index: 1080;
  }

  .ccb-site-menu:not(:is(:popover-open, .\:popover-open, .is-fallback-open)) {
    display: none;
  }

  .ccb-site-menu:is(:popover-open, .\:popover-open, .is-fallback-open) {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .ccb-site-menu::backdrop {
    background: rgba(2, 22, 36, 0.32);
  }

  .ccb-nav-link {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    background: transparent;
    border: 0;
    border-radius: 7px;
    color: rgba(255, 255, 255, 0.88);
    font-family: var(--font-primary);
    font-size: 0.84rem;
    font-weight: 700;
    padding: 0.62rem 0.85rem;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
    position: relative;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .ccb-nav-link:hover,
  .ccb-nav-link:focus-visible {
    background-color: rgba(255, 255, 255, 0.12);
    color: var(--ccb-white);
  }

  .ccb-nav-link[aria-current="page"] {
    background-color: rgba(93, 177, 150, 0.22);
    color: var(--ccb-white);
    box-shadow: inset 3px 0 0 var(--ccb-green);
  }

  .ccb-navbar.is-wide .ccb-menu-button {
    display: none;
  }

  .ccb-navbar.is-wide .ccb-site-menu {
    position: static;
    display: flex !important;
    flex-direction: row;
    align-items: center;
    gap: 0.25rem;
    inline-size: auto;
    max-inline-size: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }

  .ccb-navbar.is-wide .ccb-site-menu::backdrop {
    display: none;
  }

  .ccb-navbar.is-wide .ccb-nav-link {
    width: auto;
    padding: 0.48rem 0.8rem;
    border-radius: 6px;
    font-size: 0.82rem;
  }

  .ccb-navbar.is-wide .ccb-nav-link[aria-current="page"] {
    background-color: rgba(255, 255, 255, 0.14);
    box-shadow: none;
  }

  .ccb-navbar.is-wide .ccb-nav-link[aria-current="page"]::after {
    content: "";
    position: absolute;
    inset-inline: 0.6rem;
    inset-block-end: 0;
    border-block-end: 3px solid var(--ccb-green);
    border-radius: 2px;
  }

  .ccb-navbar.is-measuring * {
    transition: none !important;
  }

  /* Portal Master-Detail (Lista de Eventos à Esquerda + Detalhes à Direita) */
  .portal-sidebar-card {
    overflow: visible;
  }

  .portal-section-label {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ccb-primary);
    margin-bottom: 0.6rem;
  }

  .portal-live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--ccb-green);
    box-shadow: 0 0 0 3px rgba(93, 177, 150, 0.25);
    display: inline-block;
    flex-shrink: 0;
  }

  .portal-upcoming-divider {
    border-top: 1px dashed var(--ccb-gray);
  }

  .portal-event-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    text-align: left;
    padding: 0.85rem;
    border-radius: 10px;
    border: 1.5px solid var(--ccb-gray);
    background-color: var(--ccb-white);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
    min-width: 0;
  }

  .portal-event-item.is-active-event {
    cursor: pointer;
    border-color: #96C9B8;
    background: linear-gradient(180deg, #FFFFFF 0%, #F7FCFA 100%);
  }

  .portal-event-item.is-active-event:hover {
    border-color: var(--ccb-primary);
    box-shadow: 0 4px 12px rgba(3, 61, 96, 0.1);
    transform: translateY(-1px);
  }

  .portal-event-item.is-active-event.is-selected {
    border-color: var(--ccb-primary);
    border-left: 5px solid var(--ccb-green);
    background: linear-gradient(180deg, #F3FAF7 0%, #EBF5F9 100%);
    box-shadow: 0 4px 14px rgba(3, 61, 96, 0.12);
  }

  .portal-event-item.is-upcoming-disabled {
    background-color: #F6F8FA;
    border: 1px dashed #C7D0D9;
    color: var(--ccb-slate);
    opacity: 0.78;
    cursor: not-allowed;
    pointer-events: none;
  }

  .portal-date-tile {
    width: 56px;
    min-width: 56px;
    border-radius: 8px;
    padding: 0.4rem 0.25rem;
    text-align: center;
    background: linear-gradient(135deg, var(--ccb-primary) 0%, #065787 100%);
    color: var(--ccb-white);
    line-height: 1.1;
    flex-shrink: 0;
  }

  .portal-event-item.is-upcoming-disabled .portal-date-tile {
    background: #DCE3EA;
    color: #49656C;
  }

  .portal-date-day {
    display: block;
    font-size: 1.2rem;
    font-weight: 700;
  }

  .portal-date-month {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.9;
    margin-top: 2px;
  }

  .portal-event-body {
    flex: 1 1 auto;
    min-width: 0;
  }

  .portal-event-title {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--ccb-primary);
    margin: 0.2rem 0;
    line-height: 1.3;
    word-break: break-word;
  }

  .portal-event-item.is-upcoming-disabled .portal-event-title {
    color: #49656C;
  }

  .portal-event-meta {
    font-size: 0.75rem;
    color: var(--ccb-slate);
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    word-break: break-word;
  }

  .portal-detail-sticky {
    position: sticky;
    top: 1rem;
  }

  .portal-detail-hero {
    background: linear-gradient(135deg, #033D60 0%, #06588A 100%);
    border-bottom: 4px solid var(--ccb-green);
  }

  .portal-detail-hero.portal-detail-hero-muted {
    background: linear-gradient(135deg, #49656C 0%, #374F55 100%);
    border-bottom-color: var(--ccb-yellow);
  }

  .portal-hero-kicker {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #D6EBF5;
  }

  .portal-hero-meta {
    color: #E2EEF5;
  }

  .ccb-brand-logos {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background-color: var(--ccb-white);
    padding: 0.35rem 0.7rem;
    border-radius: 8px;
    border: 1px solid var(--ccb-gray);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    flex-shrink: 0;
  }

  .ccb-logo-img {
    height: 36px;
    width: auto;
    max-width: 100px;
    object-fit: contain;
    display: block;
  }

  .ccb-logo-divider {
    width: 1px;
    height: 26px;
    background-color: var(--ccb-gray);
    display: inline-block;
    flex-shrink: 0;
  }

  .ccb-report-logos {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.85rem;
    background-color: var(--ccb-white);
    padding: 0.45rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--ccb-gray);
    max-width: 100%;
  }

  .ccb-report-logos img {
    height: 40px;
    width: auto;
    max-width: 115px;
    object-fit: contain;
    display: block;
  }

  .ccb-navbar-title {
    color: var(--ccb-white);
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
  }

  .ccb-navbar-subtitle {
    color: var(--ccb-gray);
    font-size: clamp(0.7rem, 1.8vw, 0.78rem);
    margin: 0;
    line-height: 1.3;
  }

  /* Cartões e Painéis Sóbrios com Container Queries para Escala Fluida */
  .ccb-card {
    background-color: var(--ccb-white);
    border: 1px solid var(--ccb-gray);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(32, 30, 30, 0.05);
    overflow: clip;
    container-type: inline-size;
  }

  .ccb-card-header {
    background-color: var(--ccb-primary);
    color: var(--ccb-white);
    padding: 0.9rem 1.15rem;
    border-bottom: 2px solid var(--ccb-slate);
  }

  .ccb-card-header h2,
  .ccb-card-header h3,
  .ccb-card-header h4,
  .ccb-card-header h5 {
    color: var(--ccb-white);
    margin: 0;
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
  }

  @supports (font-size: 1cqi) {
    .ccb-card-header h2,
    .ccb-card-header h3 {
      font-size: clamp(0.95rem, 3.5cqi, 1.15rem);
    }
  }

  .ccb-card-subheader {
    background-color: var(--ccb-slate);
    color: var(--ccb-white);
    padding: 0.65rem 1.15rem;
    font-size: 0.84rem;
  }

  /* Destaques de Convocação Oficial */
  .ccb-info-tile {
    background-color: #F8FAFC;
    border: 1px solid var(--ccb-gray);
    border-left: 4px solid var(--ccb-primary);
    border-radius: 6px;
    padding: 0.8rem 0.95rem;
    height: 100%;
  }

  .ccb-info-tile.tile-lanche {
    border-left-color: var(--ccb-yellow);
  }

  .ccb-info-tile.tile-local {
    border-left-color: var(--ccb-green);
  }

  .ccb-info-label {
    font-size: 0.73rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ccb-slate);
    font-weight: 700;
    margin-bottom: 0.2rem;
    display: block;
  }

  .ccb-info-value {
    font-size: 0.96rem;
    font-weight: 700;
    color: var(--ccb-text);
    margin: 0;
    word-break: break-word;
  }

  /* Cartão de Auto-Detecção (Conta Google / Dispositivo) */
  .auto-match-card {
    background-color: #F2FAF7;
    border: 2px solid var(--ccb-green);
    border-radius: 8px;
    padding: 1.15rem;
    max-width: 100%;
    overflow: hidden;
  }

  .auto-match-card .flex-grow-1 {
    min-width: 0;
  }

  .auto-match-card .badge,
  .auto-match-card h4,
  .auto-match-card p {
    white-space: normal;
    text-align: left;
    max-width: 100%;
    word-break: break-word;
    line-height: 1.35;
  }

  /* Botões Institucionais com Alvo de Toque Acessível (mínimo 44px em mobile) */
  .btn-ccb-primary {
    background-color: var(--ccb-primary);
    border-color: var(--ccb-primary);
    color: var(--ccb-white);
    font-weight: 700;
    padding: 0.6rem 1.2rem;
    transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out;
  }

  .btn-ccb-primary:hover,
  .btn-ccb-primary:focus-visible {
    background-color: var(--ccb-primary-dark);
    border-color: var(--ccb-primary-dark);
    color: var(--ccb-white);
  }

  .btn-ccb-success {
    background-color: var(--ccb-green);
    border-color: var(--ccb-green);
    color: var(--ccb-white);
    font-weight: 700;
  }

  .btn-ccb-success:hover,
  .btn-ccb-success:focus-visible {
    background-color: var(--ccb-green-dark);
    border-color: var(--ccb-green-dark);
    color: var(--ccb-white);
  }

  .btn-ccb-danger {
    background-color: var(--ccb-red);
    border-color: var(--ccb-red);
    color: var(--ccb-white);
    font-weight: 700;
  }

  .btn-ccb-danger:hover,
  .btn-ccb-danger:focus-visible {
    background-color: #b53000;
    border-color: #b53000;
    color: var(--ccb-white);
  }

  .btn-ccb-slate {
    background-color: var(--ccb-slate);
    border-color: var(--ccb-slate);
    color: var(--ccb-white);
    font-weight: 700;
  }

  .btn-ccb-slate:hover,
  .btn-ccb-slate:focus-visible {
    background-color: #384f55;
    border-color: #384f55;
    color: var(--ccb-white);
  }

  .btn-ccb-outline {
    background-color: transparent;
    border: 1px solid var(--ccb-primary);
    color: var(--ccb-primary);
    font-weight: 700;
  }

  .btn-ccb-outline:hover,
  .btn-ccb-outline:focus-visible {
    background-color: var(--ccb-primary);
    color: var(--ccb-white);
  }

  /* Botão de Exportar PNG no Cabeçalho dos Cards */
  .btn-ccb-header-export {
    background-color: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.45);
    color: var(--ccb-white);
    font-size: 0.76rem;
    font-weight: 700;
    padding: 0.25rem 0.65rem;
    border-radius: 5px;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }

  .btn-ccb-header-export:hover,
  .btn-ccb-header-export:focus-visible {
    background-color: var(--ccb-white);
    border-color: var(--ccb-white);
    color: var(--ccb-primary);
  }

  /* Controles de Formulário */
  .form-label {
    font-weight: 700;
    font-size: 0.88rem;
    color: var(--ccb-text);
    margin-bottom: 0.35rem;
  }

  .form-control,
  .form-select {
    font-family: var(--font-primary);
    font-size: 0.94rem;
    border: 1px solid var(--ccb-gray);
    color: var(--ccb-text);
    padding: 0.6rem 0.85rem;
    border-radius: 6px;
    min-height: 44px;
  }

  .form-control:focus,
  .form-select:focus {
    border-color: var(--ccb-primary);
    box-shadow: 0 0 0 0.2rem rgba(3, 61, 96, 0.2);
  }

  .error-msg {
    display: none;
    color: var(--ccb-red);
    font-size: 0.8rem;
    font-weight: 700;
    margin-top: 0.3rem;
  }

  /* Feedback de campos obrigatórios somente após interação real ou tentativa de envio */
  input.user-invalid-fallback,
  select.user-invalid-fallback,
  textarea.user-invalid-fallback,
  .field-invalid input,
  .field-invalid select,
  .field-invalid textarea,
  .field-invalid .select2-selection--single {
    border-color: var(--ccb-red) !important;
    background-color: #FFF5F2;
  }

  .field-invalid > .error-msg,
  .field-invalid .error-msg {
    display: block;
  }

  input:required:user-valid,
  select:required:user-valid,
  input.user-valid-fallback,
  select.user-valid-fallback {
    border-color: var(--ccb-green);
    border-width: 1.5px;
  }

  /* Fallback progressivo para navegadores sem suporte a accent-color */
  @supports not (accent-color: #033D60) {
    input[type="checkbox"].ccb-checkbox-native {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
    }

    input[type="checkbox"].ccb-checkbox-native + span {
      position: relative;
      padding-left: 1.8rem;
      cursor: pointer;
      display: inline-block;
    }

    input[type="checkbox"].ccb-checkbox-native + span::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.15rem;
      width: 1.15rem;
      height: 1.15rem;
      border: 2px solid var(--ccb-primary);
      border-radius: 3px;
      background-color: var(--ccb-white);
    }

    input[type="checkbox"].ccb-checkbox-native:focus-visible + span::before {
      outline: 2px solid var(--ccb-primary);
      outline-offset: 2px;
    }

    input[type="checkbox"].ccb-checkbox-native:checked + span::before {
      background-color: var(--ccb-primary);
      border-color: var(--ccb-primary);
    }

    input[type="checkbox"].ccb-checkbox-native:checked + span::after {
      content: "✓";
      position: absolute;
      left: 0.22rem;
      top: 0.05rem;
      color: var(--ccb-white);
      font-weight: 700;
      font-size: 0.85rem;
    }
  }

  /* Caixa de Consentimento LGPD */
  .lgpd-consent-box {
    background-color: #F8FAFC;
    border: 1px solid var(--ccb-gray);
    border-left: 4px solid var(--ccb-primary);
    border-radius: 6px;
    padding: 0.95rem 1.1rem;
  }

  .lgpd-text {
    font-size: 0.83rem;
    color: var(--ccb-text);
    margin-bottom: 0;
  }

  /* Estilização Customizada Select2 para Identidade CCB */
  .select2-container {
    width: 100% !important;
    font-family: var(--font-primary);
    font-size: 0.94rem;
  }

  .select2-container--default .select2-selection--single {
    min-height: 44px;
    height: auto;
    border: 1px solid var(--ccb-gray);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    background-color: var(--ccb-white);
    display: flex;
    align-items: center;
  }

  .select2-container--default.select2-container--focus .select2-selection--single,
  .select2-container--default.select2-container--open .select2-selection--single {
    border-color: var(--ccb-primary);
    box-shadow: 0 0 0 0.2rem rgba(3, 61, 96, 0.2);
  }

  .select2-container--default .select2-selection--single .select2-selection__rendered {
    color: var(--ccb-text);
    line-height: 1.4;
    padding-left: 0.25rem;
    white-space: normal;
    word-break: break-word;
  }

  .select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 42px;
    right: 6px;
  }

  .select2-dropdown {
    border: 1px solid var(--ccb-primary);
    border-radius: 6px;
    box-shadow: 0 4px 12px rgba(3, 61, 96, 0.15);
    font-family: var(--font-primary);
    font-size: 0.92rem;

  }

  .badge-ccb-encerrado {
    background-color: var(--ccb-slate);

    border-radius: 4px;
    font-size: 0.76rem;
  }

  .badge-ccb-pendente,

    background-color: var(--ccb-yellow);
    color: var(--ccb-text);

    padding: 0.35em 0.65em;

  }

  .ccb-table {

    .ccb-table-mobile-cards thead {

    }

    .ccb-table-mobile-cards,
    .ccb-table-mobile-cards tbody,
    .ccb-table-mobile-cards tr,

      display: block;
      width: 100%;
    }

    .ccb-table-mobile-cards tbody tr {
      background-color: var(--ccb-white);
      border: 1px solid var(--ccb-gray);
      border-left: 4px solid var(--ccb-primary);
      border-radius: 8px;
      margin-bottom: 0.85rem;
      padding: 0.4rem 0.75rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .ccb-table-mobile-cards tbody td {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      text-align: right !important;
      padding: 0.55rem 0.2rem;

    }

    .ccb-table-mobile-cards tbody td .ccb-cell-val {

      min-width: 0;
      text-align: right;
    }

    .ccb-table-mobile-cards tbody td.ccb-mobile-stack-cell {
      flex-direction: column;
      align-items: stretch;

      gap: 0.3rem;
    }

    .ccb-table-mobile-cards tbody td.ccb-mobile-stack-cell .ccb-cell-val {
      text-align: left;
    }

    .ccb-table-mobile-cards tbody td:last-child {

      padding-top: 0.65rem;
    }

    .ccb-table-mobile-cards tfoot td:empty {

    }

    .ccb-table-mobile-cards tfoot td {
      text-align: center !important;
    }

    .ccb-table-mobile-cards tbody td[data-label]::before {

    }

    .ccb-table-mobile-cards tbody td .btn-group {
      width: 100%;

    }

    .ccb-table-mobile-cards tbody td .btn-group > .btn {
      border-radius: 6px !important;
      min-height: 38px;
      margin-left: 0 !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .qr-voucher-container {
      padding: 1rem;
    }

    .ccb-footer .container {
      flex-direction: column;
      text-align: center;
    }
  }

  @media (max-width: 575.98px) {
    /* Botões de ação em pilha de largura total em telas muito estreitas */
    .mobile-stack-buttons {
      flex-direction: column !important;
      align-items: stretch !important;
    }

  /* Regras de Impressão (Comprovante QR Code, Cartaz QR Code do Evento e Relatório PDF) */
  @media print {

      height: auto !important;

     ===================================================================== */

    border-radius: 8px;
