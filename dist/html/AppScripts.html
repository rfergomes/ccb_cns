    /**
     * Renderiza o Gráfico Anual de Reuniões, Inscrições e Presenças (mensal de Jan a Dez do ano selecionado
     * ou consolidado histórico por ano), combinando barras limpas (Inscritos e Presentes), linha de
     * quantidade de reuniões (eixo direito) e grade sintética compacta abaixo do gráfico.
     *
     * @param {Object} bundle Pacote de dados administrativos.
     */
    function renderAnnualEvolutionChart(bundle) {
      if (!window.Chart || !bundle) return;
      const ctxAnual = document.getElementById('chart-anual');
      if (!ctxAnual) return;

      const selectAnoEl = document.getElementById('chart-anual-select-ano');
      const labelAnoEl = document.getElementById('chart-anual-ano-label');
      const summaryWrapEl = document.getElementById('chart-anual-summary-wrap');

      const currentYearStr = String(new Date().getFullYear());
      const yearsSet = new Set([currentYearStr]);

      const todosEventos = bundle.eventos || [];
      const todasInscricoes = bundle.inscricoes || [];

      todosEventos.forEach((ev) => {
        const y = String(ev.DATA_EVENTO || '').slice(0, 4);
        if (/^\d{4}$/.test(y)) yearsSet.add(y);
      });
      todasInscricoes.forEach((ins) => {
        const y = String(ins.EVENTO_DATA || '').slice(0, 4);
        if (/^\d{4}$/.test(y)) yearsSet.add(y);
      });

      const sortedYears = Array.from(yearsSet).sort((a, b) => b.localeCompare(a));

      if (!AppState.admin.selectedAnnualYear) {
        AppState.admin.selectedAnnualYear = sortedYears[0] || currentYearStr;
      }

      if (selectAnoEl) {
        const currentSelected = AppState.admin.selectedAnnualYear;
        const optionsHtml = sortedYears
          .map(
            (y) =>
              `<option value="${escapeHtml(y)}" ${
                y === currentSelected ? 'selected' : ''
              }>Ano ${escapeHtml(y)} (Jan–Dez)</option>`
          )
          .concat([
            `<option value="ALL_YEARS" ${
              currentSelected === 'ALL_YEARS' ? 'selected' : ''
            }>Histórico por Ano</option>`
          ])
          .join('');
        selectAnoEl.innerHTML = optionsHtml;
      }

      const selectedMode = AppState.admin.selectedAnnualYear || currentYearStr;

      let labels = [];
      let eventosData = [];
      let inscritosData = [];
      let presentesData = [];
      let ausentesData = [];

      if (selectedMode === 'ALL_YEARS') {
        if (labelAnoEl) labelAnoEl.textContent = 'Histórico Consolidado por Ano';
        const ascYears = sortedYears.slice().sort((a, b) => a.localeCompare(b));
        labels = ascYears;
        const mapByYear = new Map();
        ascYears.forEach((y) => mapByYear.set(y, { ev: 0, ins: 0, pres: 0 }));

        todosEventos.forEach((ev) => {
          const y = String(ev.DATA_EVENTO || '').slice(0, 4);
          if (!mapByYear.has(y)) return;
          mapByYear.get(y).ev += 1;
        });

        todasInscricoes.forEach((ins) => {
          const y = String(ins.EVENTO_DATA || '').slice(0, 4);
          if (!mapByYear.has(y)) return;
          const item = mapByYear.get(y);
          item.ins += 1;
          if (ins.PRESENCA_CONFIRMADA) item.pres += 1;
        });

        ascYears.forEach((y) => {
          const st = mapByYear.get(y) || { ev: 0, ins: 0, pres: 0 };
          eventosData.push(st.ev);
          inscritosData.push(st.ins);
          presentesData.push(st.pres);
          ausentesData.push(Math.max(0, st.ins - st.pres));
        });
      } else {
        if (labelAnoEl) labelAnoEl.textContent = `Ano ${selectedMode} (Mensal)`;
        labels = [
          'Jan',
          'Fev',
          'Mar',
          'Abr',
          'Mai',
          'Jun',
          'Jul',
          'Ago',
          'Set',
          'Out',
          'Nov',
          'Dez'
        ];
        eventosData = new Array(12).fill(0);
        inscritosData = new Array(12).fill(0);
        presentesData = new Array(12).fill(0);
        ausentesData = new Array(12).fill(0);

        todosEventos.forEach((ev) => {
          const dateStr = String(ev.DATA_EVENTO || '').trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
          const [y, m] = dateStr.split('-');
          if (y !== selectedMode) return;
          const monthIdx = parseInt(m, 10) - 1;
          if (monthIdx < 0 || monthIdx > 11) return;
          eventosData[monthIdx] += 1;
        });

        todasInscricoes.forEach((ins) => {
          const dateStr = String(ins.EVENTO_DATA || '').trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
          const [y, m] = dateStr.split('-');
          if (y !== selectedMode) return;
          const monthIdx = parseInt(m, 10) - 1;
          if (monthIdx < 0 || monthIdx > 11) return;

          inscritosData[monthIdx] += 1;
          if (ins.PRESENCA_CONFIRMADA) {
            presentesData[monthIdx] += 1;
          }
        });

        for (let i = 0; i < 12; i++) {
          ausentesData[i] = Math.max(0, inscritosData[i] - presentesData[i]);
        }
      }

      if (AppState.admin.charts.anual) {
        AppState.admin.charts.anual.destroy();
      }

      AppState.admin.charts.anual = new Chart(ctxAnual, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              type: 'bar',
              label: 'Inscritos',
              data: inscritosData,
              yAxisID: 'y',
              backgroundColor: '#033D60',
              borderColor: '#033D60',
              borderWidth: 1,
              borderRadius: 4,
              maxBarThickness: 34,
              order: 2
            },
            {
              type: 'bar',
              label: 'Presentes no Local',
              data: presentesData,
              yAxisID: 'y',
              backgroundColor: '#5DB196',
              borderColor: '#5DB196',
              borderWidth: 1,
              borderRadius: 4,
              maxBarThickness: 34,
              order: 3
            },
            {
              type: 'line',
              label: 'Qtd. de Reuniões',
              data: eventosData,
              yAxisID: 'yEventos',
              borderColor: '#DC3C00',
              backgroundColor: '#DC3C00',
              borderWidth: 2,
              pointRadius: 4,
              pointHoverRadius: 6,
              pointBackgroundColor: '#DC3C00',
              pointBorderColor: '#FFFFFF',
              pointBorderWidth: 1.5,
              tension: 0.25,
              order: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              position: 'top',
              labels: {
                font: { family: 'Verdana', size: 11 },
                usePointStyle: true,
                boxWidth: 10
              }
            },
            tooltip: {
              callbacks: {
                afterBody: (items) => {
                  if (!items || !items.length) return [];
                  const idx = items[0].dataIndex;
                  const ins = inscritosData[idx] || 0;
                  const pres = presentesData[idx] || 0;
                  const aus = ausentesData[idx] || 0;
                  const pct = ins > 0 ? ((pres / ins) * 100).toFixed(1) : '0.0';
                  return [
                    `Ausentes / Pendentes: ${aus}`,
                    `Aproveitamento: ${pct}%`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { font: { family: 'Verdana', size: 11 } }
            },
            y: {
              type: 'linear',
              position: 'left',
              beginAtZero: true,
              title: {
                display: true,
                text: 'Participantes',
                font: { family: 'Verdana', size: 10, weight: 'bold' },
                color: '#033D60'
              },
              ticks: { precision: 0, font: { family: 'Verdana', size: 11 } }
            },
            yEventos: {
              type: 'linear',
              position: 'right',
              beginAtZero: true,
              suggestedMax: Math.max(4, ...eventosData) + 1,
              grid: { drawOnChartArea: false },
              title: {
                display: true,
                text: 'Qtd. Reuniões',
                font: { family: 'Verdana', size: 10, weight: 'bold' },
                color: '#DC3C00'
              },
              ticks: {
                precision: 0,
                stepSize: 1,
                font: { family: 'Verdana', size: 11 },
                color: '#DC3C00'
              }
            }
          }
        }
      });

      // Renderiza a Grade Sintética Compacta abaixo do gráfico (sem poluição visual)
      if (summaryWrapEl) {
        const totalEv = eventosData.reduce((acc, v) => acc + v, 0);
        const totalIns = inscritosData.reduce((acc, v) => acc + v, 0);
        const totalPres = presentesData.reduce((acc, v) => acc + v, 0);
        const totalAus = ausentesData.reduce((acc, v) => acc + v, 0);
        const totalPct = totalIns > 0 ? ((totalPres / totalIns) * 100).toFixed(1) : '0.0';

        const formatCell = (val, colorHex, isBold = false) => {
          if (!val) {
            return '<span style="color: #B8C2CC; font-weight: 400;">0</span>';
          }
          return `<span style="color: ${colorHex}; font-weight: ${
            isBold ? '700' : '600'
          };">${val}</span>`;
        };

        const headerCols = labels
          .map((lbl) => `<th class="text-center py-1 px-2" style="font-size: 0.72rem;">${escapeHtml(lbl)}</th>`)
          .join('');

        const rowEventos = eventosData
          .map((v) => `<td class="text-center py-1 px-2">${formatCell(v, '#DC3C00', true)}</td>`)

        const rowInscritos = inscritosData
          .map((v) => `<td class="text-center py-1 px-2">${formatCell(v, '#033D60', true)}</td>`)
          .join('');
        const rowPresentes = presentesData
          .map((v) => `<td class="text-center py-1 px-2">${formatCell(v, '#2B7A5E', true)}</td>`)
          .join('');
        const rowAusentes = ausentesData
          .map((v) => `<td class="text-center py-1 px-2">${formatCell(v, '#6C757D', false)}</td>`)
          .join('');

        summaryWrapEl.innerHTML = `
          <table class="table table-sm table-bordered mb-0 align-middle" style="font-size: 0.74rem; border-color: #E2E8F0;">
            <thead style="background-color: #F4F6F9; color: #033D60;">
              <tr>
                <th class="py-1 px-2" style="min-width: 135px; font-size: 0.72rem;">Indicador Mensal</th>
                ${headerCols}
                <th class="text-center py-1 px-2" style="background-color: #EBF1F6; font-size: 0.72rem;">TOTAL (${totalPct}% pres.)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="py-1 px-2 fw-bold" style="color: #DC3C00;">
                  <i class="bi bi-calendar2-check me-1"></i>Reuniões

    /**
     * Exporta os dados consolidados para arquivo Excel (.xlsx) via SheetJS.
     */
    function exportDashboardToExcel() {
      if (!window.XLSX || !AppState.admin.bundle) {
        toastr.warning('Dados ainda não carregados para exportação.');
        return;
      }

      const bundle = AppState.admin.bundle;
      const wb = XLSX.utils.book_new();
      const logosMeta = (AppState.portal.metadata && AppState.portal.metadata.logos) || {};

      const kpiRows = [
        ['CONGREGAÇÃO CRISTÃ NO BRASIL (CCB) - REGIONAL CAMPINAS/SP'],
        ['COMISSÃO DE NEGOCIADORES DE SUPRIMENTOS (CNS) - RELATÓRIO OFICIAL'],
        [
          'Logotipo CCB (Drive)',
          logosMeta.CCB_PRIMARY_URL ||
            'https://drive.google.com/file/d/13etuen5crQ5e66EVMRJp4cHrYWRXsREM/view'
        ],
        [
          'Logotipo CNS (Drive)',
          logosMeta.CNS_PRIMARY_URL ||
            'https://drive.google.com/file/d/11cfotJKM6DCDD3HUk99kboHWLHG2v0ah/view'
        ],
        ['Data de Geração', formatTimestampBr(bundle.generatedAt)],
        ['Escopo do Filtro', bundle.filterEventoId === 'ALL' ? 'Consolidado Histórico' : bundle.filterEventoId],
        [],
        ['INDICADOR (KPI)', 'VALOR'],
        ['Total de Inscrições', bundle.kpis.totalInscricoes],
        ['Presenças Confirmadas no Local', bundle.kpis.totalPresencas],
        ['Taxa de Presença (%)', `${bundle.kpis.taxaPresenca}%`],
        ['Total de Reuniões Catalogadas', bundle.kpis.totalReunioes],
        [],
        ['DISTRIBUIÇÃO POR CIDADE (REGIONAL CAMPINAS)', 'INSCRITOS', 'PRESENTES', 'AUSENTES', 'APROVEITAMENTO (%)']
      ];

      let sumInsXls = 0;
      let sumPresXls = 0;
      let sumAusXls = 0;

      bundle.charts.cidades.labels.forEach((cidade, i) => {
        const ins = Number(bundle.charts.cidades.inscritos[i] || 0);
        const pres = Number(bundle.charts.cidades.presentes[i] || 0);
        const aus = Math.max(0, ins - pres);
        const pct = ins > 0 ? `${((pres / ins) * 100).toFixed(1)}%` : '0.0%';
        sumInsXls += ins;
        sumPresXls += pres;
        sumAusXls += aus;
        kpiRows.push([cidade, ins, pres, aus, pct]);
      });

      const pctGeralXls =
        sumInsXls > 0 ? `${((sumPresXls / sumInsXls) * 100).toFixed(1)}%` : '0.0%';
      kpiRows.push(['TOTAL GERAL', sumInsXls, sumPresXls, sumAusXls, pctGeralXls]);

      kpiRows.push([]);
      kpiRows.push([
        'QUADRO ANALÍTICO POR CIDADE E FUNÇÃO (REGIONAL CAMPINAS)',
        'FUNÇÃO / MINISTÉRIO',
        'INSCRITOS',
        'PRESENTES',
        'AUSENTES',
        'APROVEITAMENTO (%)'
      ]);

      const groupedXls = buildCidadesFuncoesGroupedData(bundle);
      groupedXls.groups.forEach((group) => {
        group.funcoes.forEach((fnItem) => {
          kpiRows.push([
            group.cidade,
            fnItem.funcao,
            fnItem.inscritos,
            fnItem.presentes,
            fnItem.ausentes,
            `${fnItem.pct}%`
          ]);
        });
      });
      kpiRows.push([
        'TOTAL GERAL',
        '—',
        groupedXls.sumInscritos,
        groupedXls.sumPresentes,
        groupedXls.sumAusentes,
        `${groupedXls.pctGeral}%`
      ]);

      const wsKpi = XLSX.utils.aoa_to_sheet(kpiRows);
      XLSX.utils.book_append_sheet(wb, wsKpi, 'Indicadores_CNS');

      const inscricoesExport = (bundle.inscricoesFiltradas || []).map((ins) => ({
        ID_INSCRICAO: ins.ID_INSCRICAO,
        ID_EVENTO: ins.ID_EVENTO,
        REUNIAO: ins.EVENTO_TITULO,
        DATA_REUNIAO: formatDateBr(ins.EVENTO_DATA),
        NOME_COMPLETO: ins.NOME_COMPLETO,
        CIDADE: ins.CIDADE,
        FUNCAO: ins.FUNCAO,
        ACEITE_LGPD: ins.ACEITE_LGPD ? 'SIM' : 'NÃO',
        DATA_HORA_ACEITE: ins.DATA_HORA_ACEITE,
        PRESENCA_CONFIRMADA: ins.PRESENCA_CONFIRMADA ? 'SIM' : 'NÃO',
        DATA_HORA_PRESENCA: ins.DATA_HORA_PRESENCA
      }));

      const wsInscricoes = XLSX.utils.json_to_sheet(
        inscricoesExport.length > 0
          ? inscricoesExport
          : [{ AVISO: 'Nenhuma inscrição encontrada para o filtro selecionado.' }]
      );
      XLSX.utils.book_append_sheet(wb, wsInscricoes, 'Inscricoes');

      const eventosExport = (bundle.eventos || []).map((ev) => ({
        ID_EVENTO: ev.ID_EVENTO,
        TITULO: ev.TITULO,
        DATA_EVENTO: formatDateBr(ev.DATA_EVENTO),
        HORA_EVENTO: ev.HORA_EVENTO,
        HORA_LANCHE: ev.HORA_LANCHE,
        LOCAL: ev.LOCAL,
        COMPLEMENTO_LOCAL: ev.COMPLEMENTO_LOCAL || '',
        LINK_MAPA: resolveEventMapUrl(ev),
        STATUS: ev.STATUS,
        INSCRITOS: ev.TOTAL_INSCRITOS || 0,
        PRESENTES: ev.TOTAL_PRESENTES || 0
      }));

      const wsEventos = XLSX.utils.json_to_sheet(
        eventosExport.length > 0 ? eventosExport : [{ AVISO: 'Nenhuma reunião cadastrada.' }]
      );
      XLSX.utils.book_append_sheet(wb, wsEventos, 'Eventos');

      // Aba consolidada mensal (Jan-Dez do ano selecionado)
      const selectedYear =
        AppState.admin.selectedAnnualYear && AppState.admin.selectedAnnualYear !== 'ALL_YEARS'
          ? AppState.admin.selectedAnnualYear
          : String(new Date().getFullYear());
      const monthNames = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
      const anualStats = monthNames.map((mes) => ({ MES: `${mes}/${selectedYear}`, REUNIOES: 0, INSCRITOS: 0, PRESENTES: 0, AUSENTES: 0 }));

      (bundle.eventos || []).forEach((ev) => {
        const d = String(ev.DATA_EVENTO || '').trim();
        if (d.startsWith(selectedYear + '-')) {
          const mIdx = parseInt(d.slice(5, 7), 10) - 1;
          if (mIdx >= 0 && mIdx < 12) anualStats[mIdx].REUNIOES += 1;
        }
      });
      (bundle.inscricoes || []).forEach((ins) => {
        const d = String(ins.EVENTO_DATA || '').trim();
        if (d.startsWith(selectedYear + '-')) {
          const mIdx = parseInt(d.slice(5, 7), 10) - 1;
          if (mIdx >= 0 && mIdx < 12) {
            anualStats[mIdx].INSCRITOS += 1;
            if (ins.PRESENCA_CONFIRMADA) anualStats[mIdx].PRESENTES += 1;
          }
        }
      });
      anualStats.forEach((st) => {
        st.AUSENTES = Math.max(0, st.INSCRITOS - st.PRESENTES);
      });
      const wsAnual = XLSX.utils.json_to_sheet(anualStats);
      XLSX.utils.book_append_sheet(wb, wsAnual, 'Evolucao_Anual');

      const fileDate = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `Relatorio_Agenda_CNS_Campinas_${fileDate}.xlsx`);
      toastr.success('Planilha Excel (.xlsx) exportada com sucesso!');
    }

    /**
     * Exporta qualquer card (Gráfico ou Tabela) em formato de imagem PNG de alta resolução.
     * Utiliza html2canvas para capturar o cabeçalho institucional CCB e o conteúdo completo
     * do gráfico ou tabela, omitindo automaticamente botões de ação (.no-export-png).
     *
     * @param {HTMLElement} buttonEl Botão acionado no cabeçalho do card.
     */
    async function exportCardElementToPng(buttonEl) {
      if (!buttonEl) return;
      const targetCardId = buttonEl.getAttribute('data-target-card');
      const targetCanvasId = buttonEl.getAttribute('data-target-canvas');
      const filenamePrefix = buttonEl.getAttribute('data-filename') || 'Relatorio_CNS';
      const cardEl = targetCardId ? document.getElementById(targetCardId) : null;

      if (!cardEl) {
        toastr.warning('Elemento não encontrado para exportação.');
        return;
      }

      const originalHtml = buttonEl.innerHTML;
      buttonEl.disabled = true;
      buttonEl.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Exportando...';

      try {
        let dataUrl = '';

        if (window.html2canvas) {
          const renderedCanvas = await window.html2canvas(cardEl, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#FFFFFF',
            logging: false,
            ignoreElements: (el) =>
              Boolean(el && el.classList && el.classList.contains('no-export-png'))
          });
          dataUrl = renderedCanvas.toDataURL('image/png');
        } else if (targetCanvasId) {
          const chartCanvas = document.getElementById(targetCanvasId);
          if (chartCanvas) {
            const outCanvas = document.createElement('canvas');
            outCanvas.width = chartCanvas.width + 48;
            outCanvas.height = chartCanvas.height + 84;
            const ctx = outCanvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
            ctx.fillStyle = '#033D60';
            ctx.fillRect(0, 0, outCanvas.width, 48);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 15px Verdana, sans-serif';
            const titleEl = cardEl.querySelector('.ccb-card-header h3');
            ctx.fillText(titleEl ? titleEl.textContent.trim() : 'Agenda CNS', 18, 30);
            ctx.drawImage(chartCanvas, 24, 64);
            dataUrl = outCanvas.toDataURL('image/png');
          }
        }

        if (!dataUrl) {
          throw new Error('Não foi possível renderizar a imagem PNG neste navegador.');
        }

        const fileDate = new Date().toISOString().slice(0, 10);
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = `${filenamePrefix}_${fileDate}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        toastr.success('Imagem PNG exportada com sucesso!');
      } catch (err) {
        toastr.error(err.message || 'Erro ao exportar imagem PNG.');
      } finally {
        buttonEl.disabled = false;
        buttonEl.innerHTML = originalHtml;
      }
    }

    /**
     * Abre o modal com o Cartaz QR Code e Link Exclusivo de Auto-Credenciamento do Evento.
     * @param {Object} evento Objeto do evento.
     */
    function openEventoPosterModal(evento) {
      if (!evento) return;

      const baseUrl = getWebAppBaseUrl();
      const checkinLink = `${baseUrl}?view=checkin&evento=${encodeURIComponent(evento.ID_EVENTO)}`;

      document.getElementById('poster-ev-titulo').textContent = evento.TITULO;
      const posterInfoEl = document.getElementById('poster-ev-info');
      posterInfoEl.textContent = `Data: ${formatDateBr(
        evento.DATA_EVENTO
      )} • Reunião: ${evento.HORA_EVENTO}h • Local: ${evento.LOCAL}`;
      const posterCompEl = document.getElementById('poster-ev-complemento');
      if (posterCompEl) {
        const compText = String(evento.COMPLEMENTO_LOCAL || '').trim();
        const spanEl = posterCompEl.querySelector('span');
        if (spanEl) spanEl.textContent = compText;
        posterCompEl.classList.toggle('d-none', !compText);
        posterInfoEl.classList.toggle('mb-1', Boolean(compText));
        posterInfoEl.classList.toggle('mb-3', !compText);
      }
      document.getElementById('poster-ev-link').value = checkinLink;

      const qrBox = document.getElementById('poster-qr-canvas');
      qrBox.innerHTML = '';

      if (window.QRCode) {
        new QRCode(qrBox, {
          text: checkinLink,
          width: 360,
          height: 360,
          colorDark: '#033D60',
          colorLight: '#FFFFFF',
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      const modalEl = document.getElementById('modal-evento-poster');
      bootstrap.Modal.getOrCreateInstance(modalEl).show();

    /**
     * Monta o texto de convite de inscrição para o grupo de WhatsApp "CNS - Campinas",
     * seguindo os modelos oficiais adotados pela Regional Administrativa de Campinas/SP.
     *
     * @param {Object} evento Objeto do evento.
     * @param {string} [templateType='COMPLETA'] 'COMPLETA' | 'LEMBRETE'
     * @returns {string}
     */
    function buildWhatsappEventoInviteText(evento, templateType = 'COMPLETA') {
      if (!evento) return '';

      const dataBr = formatDateBr(evento.DATA_EVENTO);
      const diaSemana = getWeekdayNamePtBr(evento.DATA_EVENTO);
      const horaReuniao = evento.HORA_EVENTO || '—';
      const horaLanche = evento.HORA_LANCHE || '—';
      const local = evento.LOCAL || '—';
      const complementoLocal = String(evento.COMPLEMENTO_LOCAL || '').trim();
      const mapUrl = resolveEventMapUrl(evento);
      const portalUrl = `${getWebAppBaseUrl()}?view=portal`;

      if (templateType === 'LEMBRETE') {
        const lembreteLines = [
          'A Paz de Deus a todos, meus caros irmãos.',
          '',
          `Peço a gentileza de confirmação da presença para reunião da CNS do dia *${dataBr}* (${diaSemana}, às *${horaReuniao}h*).`,
          `${WA_ICONS.loc} *Local:* ${local}`
        ];
        if (complementoLocal) {
          lembreteLines.push(`${WA_ICONS.pin} *Complemento / Sala:* ${complementoLocal}`);
        }
        lembreteLines.push(
          `${WA_ICONS.coffee} *Serviço de Alimentação / Lanche:* ${horaLanche}h`,
          `${WA_ICONS.map} *Mapa:* ${mapUrl}`,
          '*(Motivo: preparação da alimentação)*',
          '',
          `${WA_ICONS.point} *Confirme sua presença e emita sua credencial pelo link:*`,
          portalUrl
        );
        return lembreteLines.join(WA_ICONS.nl);
      }

      const fullLines = [
        '*CONGREGAÇÃO CRISTÃ NO BRASIL*',
        '*COMISSÃO DE NEGOCIADORES DE SUPRIMENTOS — CNS*',
        '*REGIONAL ADMINISTRATIVA DE CAMPINAS/SP — RAC*',
        '',
        `*CONVOCAÇÃO — ${evento.TITULO || 'REUNIÃO GERAL PRESENCIAL DA CNS'}*`,
        '',
        'Caros irmãos e irmãs, a Paz de Deus.',
        '',
        'Convidamos para a próxima *Reunião Geral Presencial da CNS* na Regional Campinas:',
        '• *ANCIÃES e DIÁCONOS* (Membros das Reuniões Regionais de Ensinamentos — RRE da Regional Campinas);',
        '• *Membros da Administração* de todas as Administrações que compõem a Regional de Campinas;',
        '• *Grupos de trabalho da CNS:* Coordenadores, Compradores, Negociadores e Secretários.',
        '',
        `${WA_ICONS.calendar} *Dia:* ${dataBr} (${diaSemana}, às *${horaReuniao}h*)`,
        `${WA_ICONS.coffee} *Serviço de Alimentação / Lanche:* ${horaLanche}h`,
        `${WA_ICONS.loc} *Local:* ${local}`
      ];
      if (complementoLocal) {
        fullLines.push(`${WA_ICONS.pin} *Complemento / Sala:* ${complementoLocal}`);
      }
      fullLines.push(
        `${WA_ICONS.map} *Localização (Mapa):* ${mapUrl}`,
        '',
        `${WA_ICONS.point} *Confirmação de Presença / Inscrição Online (para preparação da alimentação e emissão do QR Code):*`,
        portalUrl,
        '',
        'Contamos com a presença de todos e a habitual pontualidade.',
        'Vossos irmãos em Cristo que vos saúdam.',
        '',
        '*Coordenação da CNS da Regional Administrativa de Campinas*'
      );
      return fullLines.join(WA_ICONS.nl);
    }

    /**
     * Abre o modal para criar ou editar um evento.
     * @param {Object|null} evento Se fornecido, preenche para edição.
     */
    function openEventoModal(evento = null) {
      const form = document.getElementById('form-modal-evento');
      FormAccessibilityBridge.resetFormValidation(form);

      const modalTitle = document.getElementById('modal-evento-label');
      const linkMapaEl = document.getElementById('ev-link-mapa');
      const feedbackEl = document.getElementById('ev-mapa-geocode-feedback');
      if (feedbackEl) {
        feedbackEl.classList.add('d-none');
        feedbackEl.innerHTML = '';
      }
      if (linkMapaEl) {
        delete linkMapaEl.dataset.autoGenerated;
      }

      if (evento) {
        modalTitle.innerHTML = '<i class="bi bi-pencil-square me-2"></i>Editar Reunião / Convocação';
        document.getElementById('ev-id').value = evento.ID_EVENTO;
        document.getElementById('ev-titulo').value = evento.TITULO;
        document.getElementById('ev-data').value = evento.DATA_EVENTO;
        document.getElementById('ev-hora').value = evento.HORA_EVENTO;
        document.getElementById('ev-lanche').value = evento.HORA_LANCHE;
        document.getElementById('ev-local').value = evento.LOCAL || DEFAULT_EVENTO_LOCAL;
        const compInput = document.getElementById('ev-complemento-local');
        if (compInput) compInput.value = evento.COMPLEMENTO_LOCAL || '';
        if (linkMapaEl) linkMapaEl.value = evento.LINK_MAPA || '';
        jQuery('#ev-status').val(evento.STATUS).trigger('change');
      } else {
        modalTitle.innerHTML = '<i class="bi bi-calendar-plus me-2"></i>Cadastrar Nova Reunião / Convocação';
        form.reset();
        document.getElementById('ev-id').value = '';
        document.getElementById('ev-local').value = DEFAULT_EVENTO_LOCAL;
        const compInput = document.getElementById('ev-complemento-local');
        if (compInput) compInput.value = '';
        if (linkMapaEl) linkMapaEl.value = '';
        jQuery('#ev-status').val('ATIVO').trigger('change');
      }

      const modalEl = document.getElementById('modal-evento');
      const bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);
      bsModal.show();

      if (!evento && linkMapaEl && !linkMapaEl.value.trim()) {
        applyAutoGeocodeToEventoModal({ silent: true, forceOverwrite: false });
      }
    }

    /**
     * Localiza outros eventos que estejam atualmente com status ATIVO na base carregada.
     * @param {string} [excludeId=''] UUID do evento atual a ignorar.
     * @returns {Array<Object>}
     */
    function findOtherActiveEventos(excludeId = '') {
      const cleanExclude = String(excludeId || '').trim().toLowerCase();
      const lista = (AppState.admin.bundle && AppState.admin.bundle.eventos) || [];
      return lista.filter(
        (ev) =>
          ev.STATUS === 'ATIVO' &&
          (!cleanExclude || ev.ID_EVENTO.toLowerCase() !== cleanExclude)
      );
    }

    /**
     * Submete o formulário de criação/edição de reunião.
     * Caso o campo Link de Localização esteja vazio, gera automaticamente
     * a URL codificada do Google Maps (pt-BR) a partir do endereço antes de salvar.
     * Ao definir um evento como ATIVO, alerta caso já exista outro evento ATIVO que será encerrado.
     * @param {Event} event Evento de submit.
     */
    async function handleSaveEventoSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      if (!FormAccessibilityBridge.validateFormAll(form)) {
        toastr.warning('Preencha todos os campos obrigatórios da reunião.');
        return;
      }

      const linkMapaEl = document.getElementById('ev-link-mapa');
      if (linkMapaEl && !linkMapaEl.value.trim()) {
        applyAutoGeocodeToEventoModal({ silent: true, forceOverwrite: false });
      }

      const payload = {
        ID_EVENTO: document.getElementById('ev-id').value.trim(),
        TITULO: document.getElementById('ev-titulo').value.trim(),
        DATA_EVENTO: document.getElementById('ev-data').value.trim(),
        HORA_EVENTO: document.getElementById('ev-hora').value.trim(),
        HORA_LANCHE: document.getElementById('ev-lanche').value.trim(),
        LOCAL: document.getElementById('ev-local').value.trim(),
        COMPLEMENTO_LOCAL: (
          (document.getElementById('ev-complemento-local') &&
            document.getElementById('ev-complemento-local').value) ||
          ''
        ).trim(),
        LINK_MAPA: linkMapaEl ? linkMapaEl.value.trim() : '',
        STATUS: jQuery('#ev-status').val() || 'ATIVO'
      };

      const isEdit = Boolean(payload.ID_EVENTO);
      const otherActives =
        payload.STATUS === 'ATIVO' ? findOtherActiveEventos(payload.ID_EVENTO) : [];

      const activeWarningHtml =
        otherActives.length > 0
          ? `<div class="alert alert-warning text-start small mt-3 mb-0">
               <i class="bi bi-exclamation-triangle-fill me-1"></i>
               <strong>Atenção:</strong> A reunião <strong>"${escapeHtml(
                 otherActives.map((e) => `${e.TITULO} (${formatDateBr(e.DATA_EVENTO)})`).join(', ')
               )}"</strong> encontra-se atualmente como <strong>ATIVA</strong>.<br>
               Como apenas um evento pode ficar ativo por vez no Portal e no Check-in, o evento ativo anterior será automaticamente alterado para <strong>ENCERRADO</strong>.
             </div>`
          : '';

      const confirm = await Swal.fire({
        title: isEdit ? 'Salvar alterações da reunião?' : 'Confirmar criação da reunião?',
        html: `
          <div>${escapeHtml(payload.TITULO)} (${formatDateBr(payload.DATA_EVENTO)} às ${escapeHtml(
            payload.HORA_EVENTO
          )}h) &mdash; Status: <strong>${escapeHtml(payload.STATUS)}</strong></div>
          ${activeWarningHtml}
        `,
        icon: otherActives.length > 0 ? 'warning' : 'question',
        showCancelButton: true,
        confirmButtonColor: '#033D60',
        cancelButtonColor: '#49656C',
        confirmButtonText:
          otherActives.length > 0 ? 'Sim, Ativar e Encerrar Anterior' : 'Sim, Gravar',
        cancelButtonText: 'Cancelar'
      });

      if (!confirm.isConfirmed) return;

      try {
        setLoading(true, 'Salvando reunião na planilha...');
        const response = await callServerRpc(
          'apiAdminSaveEvento',
          AppState.admin.secret,
          payload,
          AppState.admin.filterEventoId
        );

        const modalEl = document.getElementById('modal-evento');
        bootstrap.Modal.getOrCreateInstance(modalEl).hide();

        applyAdminBundle(response.bundle);
        toastr.success(response.message);
      } catch (err) {
        toastr.error(err.message);
      } finally {
        setLoading(false);
      }
    }

    /**
     * Alterna o status ATIVO / ENCERRADO de uma reunião com confirmação SweetAlert2.
     * Caso vá ativar a reunião e exista outra reunião ATIVA, informa que a anterior será encerrada.
     */
    async function handleToggleEventoStatus(idEvento, nextStatus, titulo) {
      const otherActives = nextStatus === 'ATIVO' ? findOtherActiveEventos(idEvento) : [];
      const activeWarningHtml =
        otherActives.length > 0
          ? `<div class="alert alert-warning text-start small mt-3 mb-0">
               <i class="bi bi-exclamation-triangle-fill me-1"></i>
               <strong>Atenção:</strong> A reunião <strong>"${escapeHtml(
                 otherActives.map((e) => `${e.TITULO} (${formatDateBr(e.DATA_EVENTO)})`).join(', ')
               )}"</strong> está ativa no momento e será automaticamente alterada para <strong>ENCERRADO</strong>.
             </div>`
          : '';

      const confirm = await Swal.fire({
        title: `Alterar status para ${nextStatus}?`,
        html: `<div>Reunião: <strong>"${escapeHtml(titulo)}"</strong></div>${activeWarningHtml}`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#033D60',
        cancelButtonColor: '#49656C',
        confirmButtonText:
          otherActives.length > 0
            ? 'Sim, Ativar e Encerrar Anterior'
            : `Sim, definir como ${nextStatus}`,
        cancelButtonText: 'Cancelar'
      });

      if (!confirm.isConfirmed) return;

      try {
        setLoading(true, 'Atualizando status da reunião...');
        const response = await callServerRpc(
          'apiAdminUpdateEventoStatus',
          AppState.admin.secret,
          idEvento,
          nextStatus,
          AppState.admin.filterEventoId
        );
        applyAdminBundle(response.bundle);
        toastr.success(response.message);
      } catch (err) {
        toastr.error(err.message);
      } finally {
        setLoading(false);
      }
    }

    /**
     * Exclui um evento após confirmação crítica via SweetAlert2.
     */
    async function handleDeleteEvento(idEvento, titulo) {
      const confirm = await Swal.fire({
        title: 'Excluir Reunião Permanentemente?',
        html: `A reunião <strong>${escapeHtml(
          titulo
        )}</strong> e todas as inscrições vinculadas a ela serão removidas da planilha.`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#DC3C00',
        cancelButtonColor: '#49656C',
        confirmButtonText: 'Sim, Excluir Reunião',
        cancelButtonText: 'Cancelar'
      });

      if (!confirm.isConfirmed) return;

      try {

          AppState.admin.filterEventoId

        applyAdminBundle(response.bundle);
        toastr.success(response.message);
      } catch (err) {
        toastr.error(err.message);
      } finally {
        setLoading(false);
      }
    }

    /* ========================================================================
     * ABA 3: GESTÃO DE INSCRIÇÕES (CRUD)
     * ======================================================================== */
    function renderInscricoesTable() {
      const tbody = document.getElementById('inscricoes-tbody');
      const tfoot = document.getElementById('inscricoes-tfoot');
      if (!tbody || !AppState.admin.bundle) return;

      const todas = AppState.admin.bundle.inscricoes || [];
      const filterEvento = jQuery('#ins-filter-evento').val() || 'ALL';
      const filterCidade = jQuery('#ins-filter-cidade').val() || 'ALL';
      const filterPresenca = jQuery('#ins-filter-presenca').val() || 'ALL';
      const searchQuery = (document.getElementById('ins-search-input').value || '').trim().toLowerCase();

      const filtradas = todas.filter((ins) => {
        if (filterEvento !== 'ALL' && ins.ID_EVENTO.toLowerCase() !== filterEvento.toLowerCase()) {
          return false;
        }
        if (filterCidade !== 'ALL' && ins.CIDADE !== filterCidade) {
          return false;
        }
        if (filterPresenca === 'PRESENTE' && !ins.PRESENCA_CONFIRMADA) {
          return false;
        }
        if (filterPresenca === 'PENDENTE' && ins.PRESENCA_CONFIRMADA) {
          return false;
        }
        if (searchQuery) {
          const matchNome = (ins.NOME_COMPLETO || '').toLowerCase().includes(searchQuery);
          const matchUuid = (ins.ID_INSCRICAO || '').toLowerCase().includes(searchQuery);
          const matchEmail = (ins.EMAIL || '').toLowerCase().includes(searchQuery);
          const matchFuncao = (ins.FUNCAO || '').toLowerCase().includes(searchQuery);
          if (!matchNome && !matchUuid && !matchEmail && !matchFuncao) return false;
        }
        return true;
      });

      if (filtradas.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center text-secondary py-4">
              Nenhum participante encontrado para os critérios de filtro selecionados.
            </td>
          </tr>
        `;
        if (tfoot) {
          tfoot.innerHTML = '';
        }
        return;
      }

      tbody.innerHTML = filtradas
        .map((ins) => {
          const presencaBadge = ins.PRESENCA_CONFIRMADA
            ? `<span class="badge-ccb-ativo d-inline-block"><i class="bi bi-check2-circle me-1"></i>Presente</span>
               <div class="text-secondary" style="font-size: 0.7rem;">${formatTimestampBr(ins.DATA_HORA_PRESENCA)}</div>`
            : '<span class="badge-ccb-pendente"><i class="bi bi-hourglass-split me-1"></i>Aguardando</span>';

          const lgpdBadge = ins.ACEITE_LGPD
            ? `<span class="badge bg-light text-dark border" title="Aceito em ${escapeHtml(
                formatTimestampBr(ins.DATA_HORA_ACEITE)
              )}"><i class="bi bi-shield-check text-success me-1"></i>Sim</span>`
            : '<span class="badge bg-danger">Não</span>';

          return `
            <tr>
              <td data-label="Participante" class="ccb-mobile-stack-cell">
                <div class="ccb-cell-val">
                  <div class="fw-bold">${escapeHtml(ins.NOME_COMPLETO)}</div>
                  <code class="text-secondary" style="font-size: 0.72rem;">${escapeHtml(ins.ID_INSCRICAO)}</code>
                </div>
              </td>
              <td data-label="Cidade">
                <div class="ccb-cell-val">${escapeHtml(ins.CIDADE)}</div>
              </td>
              <td data-label="Função">
                <div class="ccb-cell-val">${escapeHtml(ins.FUNCAO)}</div>
              </td>
              <td data-label="Reunião" class="ccb-mobile-stack-cell">
                <div class="ccb-cell-val">
                  <div class="small fw-bold">${escapeHtml(ins.EVENTO_TITULO)}</div>
                  <div class="text-secondary" style="font-size: 0.72rem;">${formatDateBr(ins.EVENTO_DATA)}</div>
                </div>
              </td>
              <td data-label="Contato" class="small no-export-png no-print ccb-mobile-stack-cell">
                <div class="ccb-cell-val">
                  <div><i class="bi bi-envelope text-secondary me-1"></i>${escapeHtml(ins.EMAIL || '—')}</div>
                  <div><i class="bi bi-telephone text-secondary me-1"></i>${escapeHtml(ins.TELEFONE || '—')}</div>
                </div>
              </td>
              <td data-label="LGPD" class="text-center">
                <div class="ccb-cell-val">${lgpdBadge}</div>
              </td>
              <td data-label="Presença" class="text-center">
                <div class="ccb-cell-val">${presencaBadge}</div>
              </td>
              <td data-label="Ações" class="text-end text-nowrap no-export-png ccb-mobile-stack-cell">
                <div class="btn-group btn-group-sm">
                  <button
                    type="button"
                    class="btn ${ins.PRESENCA_CONFIRMADA ? 'btn-outline-secondary' : 'btn-outline-success'} js-btn-toggle-presenca"
                    data-id="${escapeHtml(ins.ID_INSCRICAO)}"
                    data-nome="${escapeHtml(ins.NOME_COMPLETO)}"
                    data-presenca="${ins.PRESENCA_CONFIRMADA ? 'true' : 'false'}"
                    title="${ins.PRESENCA_CONFIRMADA ? 'Desmarcar Presença' : 'Confirmar Presença Manualmente'}"
                  >
                    <i class="bi ${ins.PRESENCA_CONFIRMADA ? 'bi-x-circle' : 'bi-check2-circle'}"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-primary js-btn-view-qr"
                    data-id="${escapeHtml(ins.ID_INSCRICAO)}"
                    data-nome="${escapeHtml(ins.NOME_COMPLETO)}"
                    data-detalhes="${escapeHtml(ins.CIDADE)} • ${escapeHtml(ins.FUNCAO)}"
                    title="Visualizar QR Code Individual"
                  >
                    <i class="bi bi-qr-code"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-danger js-btn-delete-inscricao"
                    data-id="${escapeHtml(ins.ID_INSCRICAO)}"
                    data-nome="${escapeHtml(ins.NOME_COMPLETO)}"
                    title="Remover Inscrição"
                  >
                    <i class="bi bi-trash3-fill"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        })
        .join('');

      if (tfoot) {
        const totalFiltrados = filtradas.length;
        const totalPresentes = filtradas.filter((ins) => Boolean(ins.PRESENCA_CONFIRMADA)).length;
        const totalAusentes = Math.max(0, totalFiltrados - totalPresentes);

        tfoot.innerHTML = `
          <tr>
            <td colspan="4" class="text-start">
              TOTAL GERAL (${totalFiltrados} inscrito${totalFiltrados === 1 ? '' : 's'})
            </td>
            <td class="no-export-png no-print"></td>
            <td colspan="2" class="text-center">
              <span class="badge-ccb-ativo d-inline-block me-2">
                <i class="bi bi-check2-circle me-1"></i>Presentes: ${totalPresentes}
              </span>
              <span class="badge-ccb-pendente d-inline-block">
                <i class="bi bi-hourglass-split me-1"></i>Ausentes: ${totalAusentes}
              </span>
            </td>
            <td class="no-export-png"></td>
          </tr>
        `;
      }
    }

    /**

      });

      try {

          'apiAdminSetPresencaManual',
          AppState.admin.secret,

        );

      ).length;

      const filterStatus = statusEl ? statusEl.value : 'ALL';

      const filtradas = lista.filter((fn) => {

        if (filterStatus === 'INATIVO' && fn.ATIVO) return false;

          const matchId = String(fn.FUNCAO_ID || '').toLowerCase().includes(searchTerm);

          const matchTipo = String(fn.TIPO || '').toLowerCase().includes(searchTerm);

              </td>

    async function detectAvailableCameras() {
      if (!window.Html5Qrcode) {

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

        return;
      }

        if (!selectCam) return;

        if (!devices || devices.length === 0) {
          showScannerPermissionHelp(true);

        }

            )

      } catch (err) {

        toastr.warning('Permissão de câmera bloqueada ou indisponível no iframe. Use "Ler QR por Foto" ou abra no navegador.');
      }
    }

    /**
     * Inicia o leitor de QR Code em tempo real via html5-qrcode com fallback progressivo para celulares.
     */
    async function startQrScanner() {
      if (!window.Html5Qrcode) {
        toastr.error('Leitor html5-qrcode indisponível.');
        return;
      }

      if (AppState.admin.scanner.isRunning) {
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showScannerPermissionHelp(true);
        toastr.warning('Câmera em tempo real indisponível aqui. Use o botão "Ler QR por Foto / Câmera".');
        return;
      }

      const viewport = document.getElementById('qr-reader-viewport');
      viewport.innerHTML = '';

      const html5QrCode = new Html5Qrcode('qr-reader-viewport');
      AppState.admin.scanner.instance = html5QrCode;

      const selectedCam = jQuery('#checkin-select-camera').val() || 'environment';
      const candidateConfigs = [];
      if (selectedCam && selectedCam !== 'environment') {
        candidateConfigs.push(selectedCam);
      }
      candidateConfigs.push({ facingMode: { ideal: 'environment' } });
      candidateConfigs.push({ facingMode: 'environment' });
      candidateConfigs.push({ facingMode: 'user' });

      const dynamicQrBox = (viewfinderWidth, viewfinderHeight) => {
        const minEdge = Math.min(viewfinderWidth || 280, viewfinderHeight || 280);
        const boxSize = Math.max(150, Math.min(230, Math.floor(minEdge * 0.72)));
        return { width: boxSize, height: boxSize };
      };

      let started = false;
      let lastError = null;

      for (const camConfig of candidateConfigs) {
        try {
          await html5QrCode.start(
            camConfig,
            {
              fps: 10,
              qrbox: dynamicQrBox
            },
            (decodedText) => {
              handleQrCodeScanned(decodedText);
            },
            () => {}
          );
          started = true;
          break;
        } catch (err) {
          lastError = err;
        }
      }

      if (started) {
        showScannerPermissionHelp(false);
        AppState.admin.scanner.isRunning = true;
        document.getElementById('btn-start-scanner').classList.add('d-none');
        document.getElementById('btn-stop-scanner').classList.remove('d-none');

        const badge = document.getElementById('scanner-status-badge');
        badge.className = 'badge badge-ccb-ativo';
        badge.textContent = 'Câmera Ativa (Lendo QR Code)';
        toastr.info('Leitor óptico de QR Code iniciado.');
        return;
      }

      try {
        await html5QrCode.clear();
      } catch (_ignore) {}

      showScannerPermissionHelp(true);
      const errName = (lastError && lastError.name) ? String(lastError.name) : '';
      if (errName === 'NotAllowedError' || errName === 'PermissionDeniedError') {
        toastr.error('Permissão da câmera negada ou bloqueada pelo iframe. Utilize "Ler QR por Foto / Câmera" logo abaixo.');
      } else {
        toastr.error('Não foi possível abrir a câmera ao vivo. Use "Ler QR por Foto / Câmera" ou verifique as permissões.');
      }
    }

    /**
     * Decodifica QR Code a partir de uma foto tirada com a câmera nativa do celular ou imagem da galeria.
     * Contorna bloqueios de stream WebRTC em iframes/WebViews.
     */
    async function handleQrPhotoFileSelected(file) {
      if (!file) return;

      const btnPhoto = document.getElementById('btn-scan-qr-photo');
      const btnGallery = document.getElementById('btn-scan-qr-gallery');
      if (btnPhoto) btnPhoto.disabled = true;
      if (btnGallery) btnGallery.disabled = true;

      try {
        let decodedText = '';

        // 1. Tenta BarcodeDetector nativo (Chrome/Android/Edge recentes)
        if ('BarcodeDetector' in window && typeof window.createImageBitmap === 'function') {
          try {
            const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
            const bitmap = await window.createImageBitmap(file);
            const barcodes = await detector.detect(bitmap);
            if (bitmap && typeof bitmap.close === 'function') {
              bitmap.close();
            }
            if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
              decodedText = String(barcodes[0].rawValue).trim();
            }
          } catch (_nativeErr) {
            // Fallback para Html5Qrcode
          }
        }

        // 2. Fallback universal com Html5Qrcode.scanFile
        if (!decodedText && window.Html5Qrcode) {
          if (AppState.admin.scanner.isRunning) {
            await stopQrScanner();
          }
          const viewport = document.getElementById('qr-reader-viewport');
          const qrInstance = new Html5Qrcode('qr-reader-viewport');
          try {
            decodedText = await qrInstance.scanFile(file, false);
          } finally {
            try {
              await qrInstance.clear();
            } catch (_ignoreClear) {}
            if (viewport) {
              viewport.innerHTML =
                '<div class="small text-light text-center p-4"><i class="bi bi-qr-code-scan d-block fs-2 mb-2 text-info"></i>Foto processada. Use a câmera ao vivo ou tire outra foto para continuar.</div>';
            }
          }
        }

        if (decodedText) {
          toastr.success('QR Code identificado na imagem!');
          await handleQrCodeScanned(decodedText);
        } else {
          toastr.warning('Nenhum QR Code nítido foi encontrado na imagem. Aproxime mais e tente novamente.');
        }
      } catch (err) {
        toastr.warning('Não foi possível ler o QR Code nesta foto. Tente enquadrar melhor o código com boa iluminação.');
      } finally {
        if (btnPhoto) btnPhoto.disabled = false;
        if (btnGallery) btnGallery.disabled = false;
      }
    }

    /**
     * Interrompe a leitura da câmera caso esteja ativa.
     */
    async function stopQrScanner() {
      const scanner = AppState.admin.scanner;
      if (!scanner.instance || !scanner.isRunning) return;

      try {
        await scanner.instance.stop();
        await scanner.instance.clear();
      } catch (_) {
        // Ignora erro ao limpar instância
      } finally {
        scanner.isRunning = false;
        scanner.instance = null;
        const btnStart = document.getElementById('btn-start-scanner');
        const btnStop = document.getElementById('btn-stop-scanner');
        if (btnStart) btnStart.classList.remove('d-none');
        if (btnStop) btnStop.classList.add('d-none');

        const badge = document.getElementById('scanner-status-badge');
        if (badge) {
          badge.className = 'badge bg-secondary';
          badge.textContent = 'Câmera Desligada';
        }
      }
    }

    /**
     * Processa um código QR lido pela câmera ou inserido manualmente no terminal.
     * @param {string} rawCode Texto lido do QR Code.
     */
    async function handleQrCodeScanned(rawCode) {
      const cleanCode = String(rawCode || '').trim();
      if (!cleanCode) return;

      const scanner = AppState.admin.scanner;
      const now = Date.now();

      if (
        scanner.isProcessingScan ||
        (scanner.lastScannedCode === cleanCode && now - scanner.lastScannedTime < 3500)
      ) {
        return;
      }

      scanner.isProcessingScan = true;
      scanner.lastScannedCode = cleanCode;
      scanner.lastScannedTime = now;

      const targetEventoId = jQuery('#checkin-select-evento').val() || 'ALL';
      const bannerEl = document.getElementById('checkin-last-result');

      try {
        bannerEl.className = 'checkin-result-banner text-center';
        bannerEl.innerHTML = `
          <div class="spinner-border spinner-border-sm text-primary mb-2"></div>
          <strong class="d-block">Validando credencial na base Google Sheets...</strong>
        `;

        const response = await callServerRpc(
          'apiAdminProcessQrCheckIn',
          AppState.admin.secret,
          cleanCode,
          targetEventoId,
          AppState.admin.filterEventoId
        );

        if (response.bundle) {
          applyAdminBundle(response.bundle);
        } else if (response.inscricao) {
          applyInscricaoDeltaToBundle(response.inscricao);
        }
        const ins = response.inscricao;

        if (response.alreadyCheckedIn) {
          playBeepSound('warning');
          toastr.warning(response.message);
          bannerEl.className = 'checkin-result-banner status-warn';
          bannerEl.innerHTML = `
            <div class="d-flex align-items-center gap-3">
              <i class="bi bi-exclamation-circle-fill fs-1 text-warning"></i>
              <div class="text-start">
                <span class="badge-ccb-pendente mb-1 d-inline-block">CHECK-IN JÁ REALIZADO ANTERIORMENTE</span>
                <h4 class="fs-5 mb-0">${escapeHtml(ins.NOME_COMPLETO)}</h4>
                <p class="small mb-0">${escapeHtml(ins.CIDADE)} &bull; ${escapeHtml(ins.FUNCAO)}</p>
                <small class="text-secondary">Registrado em: ${formatTimestampBr(ins.DATA_HORA_PRESENCA)}</small>
              </div>
            </div>
          `;

          Swal.fire({
            title: 'Presença Já Confirmada',
            html: `<strong>${escapeHtml(ins.NOME_COMPLETO)}</strong> (${escapeHtml(
              ins.CIDADE
            )}) já realizou check-in anteriormente.`,
            icon: 'warning',
            timer: 2600,
            showConfirmButton: false
          });
        } else {
          playBeepSound('success');
          toastr.success(response.message);
          bannerEl.className = 'checkin-result-banner status-ok';
          bannerEl.innerHTML = `
            <div class="d-flex align-items-center gap-3">
              <i class="bi bi-check-circle-fill fs-1" style="color: #5DB196;"></i>
              <div class="text-start">
                <span class="badge-ccb-ativo mb-1 d-inline-block">PRESENÇA CONFIRMADA COM SUCESSO</span>
                <h4 class="fs-5 mb-0">${escapeHtml(ins.NOME_COMPLETO)}</h4>
                <p class="small mb-0">${escapeHtml(ins.CIDADE)} &bull; ${escapeHtml(ins.FUNCAO)}</p>
                <small class="text-secondary">Horário: ${formatTimestampBr(ins.DATA_HORA_PRESENCA)}</small>
              </div>
            </div>
          `;

          Swal.fire({
            title: 'Bem-vindo(a)! Presença Confirmada',
            html: `
              <div class="fs-5 fw-bold" style="color: #033D60;">${escapeHtml(ins.NOME_COMPLETO)}</div>
              <div class="small text-secondary">${escapeHtml(ins.CIDADE)} &bull; ${escapeHtml(ins.FUNCAO)}</div>
            `,
            icon: 'success',
            timer: 2200,
            showConfirmButton: false
          });
        }

        scanner.sessionHistory.unshift({
          time: new Date().toLocaleTimeString('pt-BR'),
          nome: ins.NOME_COMPLETO,
          cidade: ins.CIDADE,
          alreadyCheckedIn: response.alreadyCheckedIn
        });
        renderCheckinSessionHistory();
      } catch (err) {
        playBeepSound('error');
        toastr.error(err.message);
        bannerEl.className = 'checkin-result-banner status-error';
        bannerEl.innerHTML = `
          <div class="d-flex align-items-center gap-3">
            <i class="bi bi-x-octagon-fill fs-1 text-danger"></i>
            <div class="text-start">
              <span class="badge bg-danger mb-1">CREDENCIAL RECUSADA</span>
              <p class="mb-0 fw-bold">${escapeHtml(err.message)}</p>
            </div>
          </div>
        `;

        Swal.fire({
          title: 'Credencial Inválida',
          text: err.message,
          icon: 'error',
          confirmButtonColor: '#DC3C00'
        });
      } finally {
        setTimeout(() => {
          scanner.isProcessingScan = false;
        }, 1200);
      }
    }

    /**
     * Atualiza a tabela de histórico de check-ins realizados na sessão atual.
     */
    function renderCheckinSessionHistory() {
      const tbody = document.getElementById('checkin-history-tbody');
      if (!tbody) return;

      const list = AppState.admin.scanner.sessionHistory.slice(0, 12);
      if (list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="text-center text-secondary py-3">Nenhuma leitura realizada nesta sessão.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list
        .map(
          (item) => `
          <tr>
            <td class="text-nowrap">${escapeHtml(item.time)}</td>
            <td class="fw-bold">${escapeHtml(item.nome)}</td>
            <td>${escapeHtml(item.cidade)}</td>
            <td>
              ${
                item.alreadyCheckedIn
                  ? '<span class="badge-ccb-pendente">Releitura</span>'
                  : '<span class="badge-ccb-ativo">Confirmado</span>'
              }
            </td>
          </tr>
        `
        )
        .join('');
    }

    /* ========================================================================
     * MÁSCARA DE TELEFONE E BINDING DE EVENTOS DO DOM
     * ======================================================================== */
    function formatPhoneMask(value) {
      const digits = String(value || '').replace(/\D/g, '').slice(0, 11);
      if (digits.length === 0) return '';
      if (digits.length <= 2) return `(${digits}`;
      if (digits.length <= 6) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
      if (digits.length <= 10) {
        return `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
      }
      return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
    }

        FormAccessibilityBridge.resetFormValidation(formManIns);
        const modalEl = document.getElementById('modal-inscricao-manual');
        bootstrap.Modal.getOrCreateInstance(modalEl).show();
      });

      // Delegação de cliques na Tabela de Inscrições
      document.getElementById('inscricoes-tbody').addEventListener('click', (e) => {
        const btnTogglePres = e.target.closest('.js-btn-toggle-presenca');
        if (btnTogglePres) {
          handleTogglePresencaManual(
            btnTogglePres.getAttribute('data-id'),
            btnTogglePres.getAttribute('data-nome'),
            btnTogglePres.getAttribute('data-presenca') === 'true'
          );
          return;
        }

        const btnQr = e.target.closest('.js-btn-view-qr');
        if (btnQr) {
          openAdminParticipantQrModal(
            btnQr.getAttribute('data-id'),
            btnQr.getAttribute('data-nome'),
            btnQr.getAttribute('data-detalhes')
          );
          return;
        }

        const btnDel = e.target.closest('.js-btn-delete-inscricao');
        if (btnDel) {
          handleDeleteInscricao(
            btnDel.getAttribute('data-id'),
            btnDel.getAttribute('data-nome')
          );
        }
      });

      // Gestão de Funções e Ministérios (CRUD)
      const btnNovaFuncao = document.getElementById('btn-nova-funcao');
      if (btnNovaFuncao) {
        btnNovaFuncao.addEventListener('click', () => openFuncaoModal(null));
      }

      const btnSeedFuncoes = document.getElementById('btn-seed-funcoes');
      if (btnSeedFuncoes) {
        btnSeedFuncoes.addEventListener('click', handleSeedFuncoesInstitucionais);
      }

      const formModalFuncao = document.getElementById('form-modal-funcao');
      if (formModalFuncao) {
        formModalFuncao.addEventListener('submit', handleSaveFuncaoSubmit);
      }

      const fnSearchInput = document.getElementById('fn-filter-search');
      if (fnSearchInput) {
        fnSearchInput.addEventListener('input', () => renderFuncoesAdminSection());
      }
      const fnTipoFilter = document.getElementById('fn-filter-tipo');
      if (fnTipoFilter) {
        fnTipoFilter.addEventListener('change', () => renderFuncoesAdminSection());
      }
      const fnStatusFilter = document.getElementById('fn-filter-status');
      if (fnStatusFilter) {
        fnStatusFilter.addEventListener('change', () => renderFuncoesAdminSection());
      }

      const funcoesTbody = document.getElementById('admin-funcoes-tbody');
      if (funcoesTbody) {
        funcoesTbody.addEventListener('click', (e) => {
          const btnEdit = e.target.closest('.js-btn-edit-funcao');
          if (btnEdit) {
            const id = btnEdit.getAttribute('data-id');
            const found =
              AppState.admin.bundle &&
              (AppState.admin.bundle.funcoes || []).find((f) => f.FUNCAO_ID === id);
            if (found) openFuncaoModal(found);
            return;
          }

          const btnToggle = e.target.closest('.js-btn-toggle-funcao');
          if (btnToggle) {
            handleToggleFuncaoStatus(
              btnToggle.getAttribute('data-id'),
              btnToggle.getAttribute('data-nome'),
              btnToggle.getAttribute('data-ativo') === 'true'
            );
            return;
          }

          const btnDel = e.target.closest('.js-btn-delete-funcao');
          if (btnDel) {
            handleDeleteFuncao(btnDel.getAttribute('data-id'), btnDel.getAttribute('data-nome'));
          }
        });
      }

      // Abas do Admin: rolar aba selecionada suavemente para área visível no mobile
      const adminTabsEl = document.getElementById('adminTabs');
      if (adminTabsEl) {
        adminTabsEl.addEventListener('shown.bs.tab', (e) => {
          if (e.target && typeof e.target.scrollIntoView === 'function') {
            e.target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
          }
          if (e.target && e.target.id === 'tab-btn-checkin') {
            initCheckinEnvironmentHints();
          }
        });
      }

      // Controles do Terminal de Check-in (Recepção)
      document.getElementById('btn-start-scanner').addEventListener('click', startQrScanner);
      document.getElementById('btn-stop-scanner').addEventListener('click', stopQrScanner);
      document.getElementById('btn-detect-cameras').addEventListener('click', detectAvailableCameras);

      const btnScanPhoto = document.getElementById('btn-scan-qr-photo');
      const inputScanPhoto = document.getElementById('checkin-qr-file-input');
      if (btnScanPhoto && inputScanPhoto) {
        btnScanPhoto.addEventListener('click', () => {
          inputScanPhoto.value = '';
          inputScanPhoto.click();
        });
        inputScanPhoto.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            handleQrPhotoFileSelected(file);
          }
        });
      }

      const btnScanGallery = document.getElementById('btn-scan-qr-gallery');
      const inputScanGallery = document.getElementById('checkin-qr-gallery-input');
      if (btnScanGallery && inputScanGallery) {
        btnScanGallery.addEventListener('click', () => {
          inputScanGallery.value = '';
          inputScanGallery.click();
        });
        inputScanGallery.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            handleQrPhotoFileSelected(file);
          }
        });
      }

      const btnCopyCheckinUrl = document.getElementById('btn-copy-checkin-app-url');
      if (btnCopyCheckinUrl) {
        btnCopyCheckinUrl.addEventListener('click', async () => {
          const url = `${getWebAppBaseUrl()}?view=admin`;
          try {
            await navigator.clipboard.writeText(url);
            toastr.success('Link do Painel copiado! Cole no Chrome ou Safari.');
          } catch (_copyErr) {
            prompt('Copie o link abaixo e abra no Chrome/Safari:', url);
          }
        });
      }

      document.getElementById('checkin-manual-uuid').addEventListener('click', () => {});
      document.getElementById('btn-checkin-manual-submit').addEventListener('click', () => {
        const input = document.getElementById('checkin-manual-uuid');
        const code = input.value.trim();
        if (!code) {
          toastr.warning('Informe ou cole o código UUID da credencial.');
          return;
        }
        handleQrCodeScanned(code);
        input.value = '';
      });

      document.getElementById('checkin-manual-uuid').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('btn-checkin-manual-submit').click();
        }
      });
    }

    /* ========================================================================
     * BOOTSTRAP DA APLICAÇÃO NO CARREGAMENTO DO DOM
     * ======================================================================== */
    function initApplication() {
      const boot = window.__BOOTSTRAP_DATA__ || {};

      if (boot.configError) {
        const banner = document.getElementById('config-error-banner');
        const msg = document.getElementById('config-error-message');
        if (banner && msg) {
          msg.textContent = boot.configError;
          banner.classList.remove('d-none');
        }
      }

      if (boot.metadata) {
        AppState.portal.metadata = boot.metadata;
        syncServerClockOffset(boot.metadata);
      }
      AppState.portal.hasActiveEvent = Boolean(boot.hasActiveEvent);
      AppState.portal.activeEvent = boot.activeEvent || null;
      AppState.portal.activeEvents = boot.activeEvents || [];
      AppState.portal.upcomingEvents = boot.upcomingEvents || [];
      AppState.portal.googleSessionMatch = boot.googleSessionMatch || null;

      initResponsiveNavbar();
      initCheckinEnvironmentHints();
      populateStaticSelectOptions();
      bindDomEvents();

      if (boot.initialVoucher && boot.initialVoucher.inscricao) {
        AppState.portal.lastVoucher = boot.initialVoucher;
        renderVoucherScreen(boot.initialVoucher);
      } else {
        switchView(AppState.currentView);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApplication);
    } else {
      initApplication();
    }
  })();
</script>
